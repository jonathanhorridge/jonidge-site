<!doctype html>
<html lang="en">
<head>
<!-- jonidge-play-gate -->
<meta name="robots" content="noindex,nofollow">
<style id="jonidge-gate-css">html{visibility:hidden!important}</style>
<script>
(function(){
  try {
    var t = localStorage.getItem("jonidge-play-v1") || "";
    if (!/^v1\.[0-9a-f]{128}$/i.test(t)) {
      location.replace("/play/");
      return;
    }
    var s = document.getElementById("jonidge-gate-css");
    if (s) s.remove();
  } catch (e) {
    location.replace("/play/");
  }
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1E8FB5">
<meta name="description" content="Ferry Jam: a parking-jam puzzle with color ferries. Clear the harbor.">
<title>Ferry Jam</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>

</div>

</body>
</html>
