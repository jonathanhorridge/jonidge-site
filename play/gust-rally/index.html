<!doctype html>
<html lang="en">
<head>
<!-- jonidge-play-gate -->
<meta name="robots" content="noindex,nofollow">
<style id="jonidge-gate-css">html{visibility:hidden!important}</style>
<script>
(function(){
  try {
    var t = localStorage.getItem("jonidge-play-v1") || "";
    if (!/^v1\.[0-9a-f]{128}$/i.test(t)) {
      location.replace("/play/");
      return;
    }
    var s = document.getElementById("jonidge-gate-css");
    if (s) s.remove();
  } catch (e) {
    location.replace("/play/");
  }
})();
</script>

<script>
(function () {
  var p = location.pathname;
  if (p && !/\/$/.test(p) && !/\.[a-zA-Z0-9]+$/.test(p)) {
    location.replace(p + '/' + location.search + location.hash);
  }
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#7EC8FF">
<meta name="description" content="Gust Rally: a one-thumb kite racer by Jonidge. Hold to rise, release to dive. A new course every day.">
<title>Gust Rally · daily kite racer</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="assets/fonts/Fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="ui" class="screen"></div>
<script src="js/config.js"></script>
<script src="js/sim.js"></script>
<script src="js/audio.js"></script>
<script src="js/store.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</body>
</html>
