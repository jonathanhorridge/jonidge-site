<!doctype html>
<html lang="en">
<head>
<!-- jonidge-play-gate -->
<meta name="robots" content="noindex,nofollow">
<style id="jonidge-gate-css">html{visibility:hidden!important}</style>
<script>
(function(){
  try {
    var t = localStorage.getItem("jonidge-play-v1") || "";
    if (!/^v1\.[0-9a-f]{128}$/i.test(t)) {
      location.replace("/play/");
      return;
    }
    var s = document.getElementById("jonidge-gate-css");
    if (s) s.remove();
  } catch (e) {
    location.replace("/play/");
  }
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f7e3bd">
<meta name="description" content="Hexglen: a cozy daily hex-tile puzzle. Same 15 tiles for everyone, 3 to 5 minutes.">
<title>Hexglen</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"><main id="view"></main></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/engine.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
