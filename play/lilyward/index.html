<!doctype html>
<html lang="en">
<head>
<!-- jonidge-play-gate -->
<meta name="robots" content="noindex,nofollow">
<style id="jonidge-gate-css">html{visibility:hidden!important}</style>
<script>
(function(){
  try {
    var t = localStorage.getItem("jonidge-play-v1") || "";
    if (!/^v1\.[0-9a-f]{128}$/i.test(t)) {
      location.replace("/play/");
      return;
    }
    var s = document.getElementById("jonidge-gate-css");
    if (s) s.remove();
  } catch (e) {
    location.replace("/play/");
  }
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#13707E">
<meta name="description" content="Lilyward: frog pond tower defense by Jonidge.">
<title>Lilyward</title>
<link rel="icon" href="assets/img/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<link rel="preload" as="image" href="assets/img/title.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bg"></div>
<canvas id="game"></canvas>
<header id="hud" hidden>
  <button id="h-pause" class="iconbtn" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#fff"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#fff"/></svg></button>
  <div class="chip"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.3-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.7-8 11-8 11z" fill="#FF5A6E" stroke="#8C1D2C" stroke-width="1.5"/></svg></span><b id="h-lives">20</b></div>
  <div class="chip"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFD23F" stroke="#B8860B" stroke-width="1.8"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#E0A800" stroke-width="1.5"/></svg></span><b id="h-coins">0</b></div>
  <div class="chip wave" id="h-wave">Wave 1/5</div>
  <button id="h-speed" class="iconbtn speed">1&times;</button>
</header>
<div id="coach" hidden></div>
<footer id="bottom" hidden>
  <button id="chorus" class="chorus" aria-label="Frog chorus"><span class="ring"></span><span class="lbl">CROAK</span></button>
  <button id="send" class="btn green send"><span id="send-label">Start wave</span></button>
</footer>
<div id="sheet" hidden></div>
<section id="scr-title" class="screen"></section>
<section id="scr-map" class="screen" hidden></section>
<section id="scr-upgrades" class="screen" hidden></section>
<section id="scr-shop" class="screen" hidden></section>
<div id="modal-root" hidden><div id="modal" class="modal"></div></div>
<div id="ad" hidden></div>
<div id="toast" role="status"></div>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/audio.js"></script>
<script src="js/ads.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
