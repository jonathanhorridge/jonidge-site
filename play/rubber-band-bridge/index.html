  const WORLDS = THEMES.map(function (t, i) { return { name: t.name, index: i }; });

  // ===== ui.js: screens, HUD, modals, input, main loop =====
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let dpr = 1, scale = 1, ox = 0, oy = 0, vw = W, vh = H;

  const ui = {
    screen: "title", world: 0, modal: null, buttons: [], pressed: null,
    fade: 0, fadeDir: 0, pending: null, toast: null, dragging: null, selPeg: -1,
    hoverPeg: -1, session: null, bannerT: 0, pointer: { x: -99, y: -99, down: false },
    speed: 1, frame: 0, errors: 0, lastTs: 0, acc: 0,
  };

  // ---------- helpers ----------
  function levelIndex(id) { for (let i = 0; i < LEVELS.length; i++) if (LEVELS[i].id === id) return i; return -1; }
  function isCleared(idx) { const r = levelRec(LEVELS[idx].id); return !!(r && r.cleared); }
  function isUnlocked(idx) { return idx === 0 || (idx > 0 && isCleared(idx - 1)) || isCleared(idx); }
  function worldUnlocked(w) { return isUnlocked(w * 10); }
  function worldStars(w) {
    let s = 0;
    for (let i = w * 10; i < w * 10 + 10 && i < LEVELS.length; i++) { const r = levelRec(LEVELS[i].id); if (r) s += r.stars; }
    return s;
  }
  function totalStars() { let s = 0; for (let w = 0; w < WORLDS.length; w++) s += worldStars(w); return s; }
  function firstOpenLevel() { for (let i = 0; i < LEVELS.length; i++) if (!isCleared(i)) return i; return LEVELS.length - 1; }

  function toast(text, secs) { ui.toast = { text: text, t: secs || 2.4 }; }

  function setScreen(fn) {
    if (ui.fadeDir === 1) return;
    ui.fadeDir = 1;
    ui.pending = fn;
  }

  function hintCount(id) { return save.hints[id] || 0; }
  function freeHintsAvailable(id, L) {
    const sol = L.solution.length;
    if (hintCount(id) >= sol) return 0;
    const earned = Math.floor((save.fails[id] || 0) / FAILS_PER_FREE_HINT);
    return Math.max(0, earned - (save.freeUsed[id] || 0));
  }

  // ---------- level flow ----------
  function startLevel(idx) {
    const L = LEVELS[idx];
    theme = themeFor(L.world);
    ui.world = L.world;
    ui.session = { idx: idx, id: L.id, extra: 0, cap: 3, usedSolution: false, solAnim: null, winWait: -1, attempts: 0 };
    loadLevelData(L, false, 0);
    ui.screen = "play";
    ui.modal = null;
    ui.dragging = null;
    ui.selPeg = -1;
    ui.bannerT = 0;
    if (!save.seenHelp) { save.seenHelp = true; persist(); ui.modal = { type: "howto" }; }
  }

  hooks.onWin = function () {
    if (ui.session) ui.session.winWait = 1.0;
  };
  hooks.onFail = function () {
    const s = ui.session;
    if (!s) return;
    const L = LEVELS[s.idx];
    const before = freeHintsAvailable(s.id, L);
    save.fails[s.id] = (save.fails[s.id] || 0) + 1;
    persist();
    if (freeHintsAvailable(s.id, L) > before) toast("Free hint unlocked! Tap Help.", 3.2);
  };
  hooks.onFailDone = function () { restartKeepLayout(); };

  function completeLevel() {
    const s = ui.session;
    const L = LEVELS[s.idx];
    const raw = starCount(state.goUsed, L.par);
    const stars = Math.min(raw, s.cap);
    const before = levelRec(L.id);
    const wasCleared = !!(before && before.cleared);
    const pay = recordClear(L.id, stars);
    ui.modal = { type: "complete", raw: raw, stars: stars, pay: pay, t: 0, wasCleared: wasCleared, best: levelRec(L.id).stars };
    for (let k = 0; k < stars; k++) setTimeout(function () { sfx.star(k); }, 350 + k * 260);
    if (pay) setTimeout(function () { sfx.coin(0); sfx.coin(1); }, 350 + stars * 260);
  }

  function nextLevel() {
    const s = ui.session;
    const n = s.idx + 1;
    if (n >= LEVELS.length) { setScreen(function () { ui.screen = "levels"; ui.modal = { type: "ending" }; }); return; }
    if (LEVELS[n].world !== LEVELS[s.idx].world) {
      setScreen(function () { ui.screen = "levels"; ui.world = LEVELS[n].world; theme = themeFor(ui.world); ui.modal = { type: "newworld", world: ui.world }; });
      return;
    }
    setScreen(function () { startLevel(n); });
  }

  function clearBands() {
    if (state.mode !== "build") return;
    state.bands = [];
    state.ghosts = [];
    sfx.click();
  }

  function stopRun() {
    if (state.mode === "run" || state.mode === "fail") { restartKeepLayout(); sfx.click(); }
  }

  function pressGo() {
    if (state.mode === "build" && !ui.session.solAnim) {
      if (!state.bands.length) { toast("Place a band first: drag from peg to peg."); sfx.deny(); return; }
      ui.session.attempts += 1;
      go();
    } else if (state.mode === "run" || state.mode === "fail") stopRun();
  }

  // ---------- assists ----------
  function useHint(free) {
    const s = ui.session, L = LEVELS[s.idx];
    if (hintCount(s.id) >= L.solution.length) { toast("Every band of the answer is already shown."); return false; }
    if (free) {
      if (freeHintsAvailable(s.id, L) <= 0) return false;
      save.freeUsed[s.id] = (save.freeUsed[s.id] || 0) + 1;
    } else if (!spendCoins(PRICES.hint)) { notEnough(PRICES.hint); return false; }
    save.hints[s.id] = hintCount(s.id) + 1;
    persist();
    sfx.coin(0);
    ui.modal = null;
    toast("Hint: band " + hintCount(s.id) + " of " + L.solution.length + " is glowing.", 3);
    return true;
  }

  function useExtra() {
    const s = ui.session;
    if (s.extra >= MAX_EXTRA) { toast("You already have the most extra bands."); return false; }
    if (!spendCoins(PRICES.extra)) { notEnough(PRICES.extra); return false; }
    s.extra += 1;
    s.cap = Math.min(s.cap, 2);
    state.extraBands = s.extra;
    state.budget = LEVELS[s.idx].budget + s.extra;
    sfx.coin(0);
    ui.modal = null;
    toast("+1 band! (this visit, best 2 stars)", 2.6);
    return true;
  }

  function useSolution() {
    const s = ui.session, L = LEVELS[s.idx];
    const owned = !!(save.solBought && save.solBought[s.id]);
    if (!owned) {
      if (!spendCoins(PRICES.solution)) { notEnough(PRICES.solution); return false; }
      if (!save.solBought) save.solBought = {};
      save.solBought[s.id] = true;
      persist();
      sfx.coin(0);
    }
    s.usedSolution = true;
    s.cap = 1;
    ui.modal = null;
    loadLevelData(L, false, s.extra);
    s.solAnim = { k: 0, t: 0.5 };
    return true;
  }

  function notEnough(price) {
    sfx.deny();
    toast("Need " + price + " coins (you have " + save.coins + "). Watch an ad or fail 3 times for a free hint.", 3.4);
  }

  function doAd() {
    if (adsLeftToday() <= 0) { toast("No more ads today. Come back tomorrow!"); sfx.deny(); return; }
    watchAd(function (res) {
      if (res.ok) { toast("+" + res.coins + " coins. Thanks for watching!"); sfx.coin(0); sfx.coin(1); }
      else if (res.reason === "closed") toast("Ad closed early, so no reward.");
      else if (res.reason === "cap") toast("No more ads today. Come back tomorrow!");
    });
  }

  function doBuy(pack) {
    buyPack(pack, function (res) {
      if (res.ok) {
        sfx.coin(0); sfx.coin(1); sfx.coin(2);
        toast((res.test ? "TEST MODE: " : "") + "+" + res.coins + " coins" + (res.test ? " (no payment)" : ""), 3);
      } else if (res.reason === "web") {
        ui.modal = { type: "notice", title: "App only", text: "Purchases are available in the app version. Nothing was charged.", back: ui.modal };
      } else toast("Purchase did not go through. Nothing was charged.");
    });
  }

  // ---------- layout / input ----------
  function resize() {
    vw = Math.max(1, window.innerWidth);
    vh = Math.max(1, window.innerHeight);
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    scale = Math.min(vw / W, vh / H);
    ox = (vw - W * scale) / 2;
    oy = (vh - H * scale) / 2;
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    canvas.style.width = vw + "px";
    canvas.style.height = vh + "px";
  }

  function toDesign(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left - ox) / scale, y: (e.clientY - rect.top - oy) / scale };
  }

  function hitButton(x, y) {
    for (let i = ui.buttons.length - 1; i >= 0; i--) {
      const b = ui.buttons[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
    }
    return null;
  }

  function pegAt(x, y, level) {
    let best = -1, bestD = PEG_HIT;
    for (let i = 0; i < level.pegs.length; i++) {
      const d = dist(x, y, level.pegs[i].x, level.pegs[i].y);
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  function bandAt(x, y) {
    let best = -1, bestD = 14;
    for (let b = 0; b < state.bands.length; b++) {
      const n = state.bands[b].nodes;
      for (let i = 1; i < n.length; i++) {
        const p = closestPoint(n[i - 1], n[i], x, y);
        const d = dist(x, y, p.x, p.y);
        if (d < bestD) { bestD = d; best = b; }
      }
    }
    return best;
  }

  function canBuild() {
    return ui.screen === "play" && !ui.modal && state.mode === "build" && ui.session && !ui.session.solAnim && ui.fadeDir === 0;
  }

  function tryPlace(a, b) {
    const L = currentLevel();
    sfx.stopStretch(canPlace(a, b, L) === true);
    if (placeBand(a, b)) ui.bannerT = Math.max(ui.bannerT, 99);
  }

  function onDown(e) {
    if (e.button !== undefined && e.button > 0) return;
    e.preventDefault();
    sfx.ensure();
    const p = toDesign(e);
    ui.pointer.x = p.x; ui.pointer.y = p.y; ui.pointer.down = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    if (ui.fadeDir !== 0) return;
    const btn = hitButton(p.x, p.y);
    if (btn) { ui.pressed = btn; return; }
    if (!canBuild()) return;
    const L = currentLevel();
    const peg = pegAt(p.x, p.y, L);
    if (peg >= 0) {
      if (ui.selPeg >= 0 && ui.selPeg !== peg) {
        const from = ui.selPeg;
        ui.selPeg = -1;
        tryPlace(from, peg);
        return;
      }
      ui.dragging = { from: peg, x: p.x, y: p.y, sx: p.x, sy: p.y };
      sfx.startStretch(0.6);
      return;
    }
    ui.selPeg = -1;
    const band = bandAt(p.x, p.y);
    if (band >= 0) { removeBandAt(band); toast("Band removed.", 1.2); }
  }

  function onMove(e) {
    const p = toDesign(e);
    ui.pointer.x = p.x; ui.pointer.y = p.y;
    if (ui.screen === "play" && state.level) ui.hoverPeg = pegAt(p.x, p.y, state.level);
    if (!ui.dragging) return;
    e.preventDefault();
    ui.dragging.x = p.x;
    ui.dragging.y = p.y;
    const L = currentLevel();
    const a = L.pegs[ui.dragging.from];
    const hover = pegAt(p.x, p.y, L);
    const bx = hover >= 0 ? L.pegs[hover].x : p.x;
    const by = hover >= 0 ? L.pegs[hover].y : p.y;
    sfx.updateStretch(straightStrain(a.x, a.y, bx, by));
  }

  function onUp(e) {
    const p = toDesign(e);
    ui.pointer.down = false;
    if (ui.pressed) {
      const b = ui.pressed;
      ui.pressed = null;
      const now = hitButton(p.x, p.y);
      if (now && now.key === b.key && !b.disabled) { sfx.click(); b.onClick(); }
      else if (now && now.key === b.key && b.disabled && b.onDisabled) b.onDisabled();
      return;
    }
    if (!ui.dragging) return;
    const d = ui.dragging;
    ui.dragging = null;
    if (!canBuild()) { sfx.stopStretch(false); return; }
    const L = currentLevel();
    const to = pegAt(p.x, p.y, L);
    if (to >= 0 && to !== d.from) { tryPlace(d.from, to); return; }
    sfx.stopStretch(false);
    if (to === d.from && dist(p.x, p.y, d.sx, d.sy) < 14) ui.selPeg = ui.selPeg === d.from ? -1 : d.from;
  }

  function onCancel() {
    ui.pointer.down = false;
    ui.pressed = null;
    if (ui.dragging) { ui.dragging = null; sfx.stopStretch(false); }
  }

  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", onCancel);
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("resize", resize);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      if (ui.screen === "play" && !ui.modal && (state.mode === "build" || state.mode === "run")) ui.modal = { type: "pause" };
      if (sfx.ctx && sfx.ctx.state === "running") { try { sfx.ctx.suspend(); } catch (e) { /* ignore */ } }
    } else if (sfx.ctx && sfx.ctx.state === "suspended" && (sfx.soundOn || sfx.musicOn)) {
      try { sfx.ctx.resume(); } catch (e) { /* ignore */ }
    }
  });
  window.addEventListener("keydown", function (e) {
    if (document.getElementById("rbb-ad")) return;
    if (ui.screen !== "play") { if (e.key === "Escape" && ui.modal) ui.modal = null; return; }
    if (e.key === "Escape" || e.key === "p" || e.key === "P") {
      if (ui.modal && ui.modal.type !== "complete") ui.modal = null;
      else if (!ui.modal) ui.modal = { type: "pause" };
      return;
    }
    if (ui.modal) return;
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); pressGo(); }
    else if (e.key === "z" || e.key === "Z" || e.key === "Backspace") undo();
    else if (e.key === "r" || e.key === "R") { if (state.mode === "build") clearBands(); else stopRun(); }
    else if (e.key === "h" || e.key === "H") ui.modal = { type: "help" };
  });

  // ---------- drawing primitives ----------
  function text(str, x, y, size, color, align, weight) {
    ctx.font = (weight || "bold") + " " + size + "px " + FONT;
    ctx.fillStyle = color;
    ctx.textAlign = align || "center";
    ctx.textBaseline = "middle";
    ctx.fillText(str, x, y);
  }

  function wrap(str, x, y, maxW, lineH, size, color, align, weight) {
    ctx.font = (weight || "normal") + " " + size + "px " + FONT;
    const words = String(str).split(" ");
    const lines = [];
    let line = "";
    for (let i = 0; i < words.length; i++) {
      const test = line ? line + " " + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = words[i]; }
      else line = test;
    }
    if (line) lines.push(line);
    for (let i = 0; i < lines.length; i++) text(lines[i], x, y + i * lineH, size, color, align, weight || "normal");
    return lines.length;
  }

  function icon(name, x, y, s, color) {
    const c = ctx;
    c.save();
    c.translate(x, y);
    c.strokeStyle = color; c.fillStyle = color;
    c.lineWidth = Math.max(2, s * 0.14); c.lineCap = "round"; c.lineJoin = "round";
    const h = s / 2;
    if (name === "pause") { c.fillRect(-h * 0.6, -h * 0.7, h * 0.4, h * 1.4); c.fillRect(h * 0.2, -h * 0.7, h * 0.4, h * 1.4); }
    else if (name === "play" || name === "go") { c.beginPath(); c.moveTo(-h * 0.5, -h * 0.7); c.lineTo(h * 0.7, 0); c.lineTo(-h * 0.5, h * 0.7); c.closePath(); c.fill(); }
    else if (name === "stop") { c.fillRect(-h * 0.55, -h * 0.55, h * 1.1, h * 1.1); }
    else if (name === "undo") { c.beginPath(); c.arc(h * 0.1, h * 0.1, h * 0.6, Math.PI * 1.1, Math.PI * 0.45); c.stroke(); c.beginPath(); c.moveTo(-h * 0.85, -h * 0.55); c.lineTo(-h * 0.5, h * 0.05); c.lineTo(-h * 0.05, -h * 0.35); c.stroke(); }
    else if (name === "clear") { c.beginPath(); c.moveTo(-h * 0.55, -h * 0.55); c.lineTo(h * 0.55, h * 0.55); c.moveTo(h * 0.55, -h * 0.55); c.lineTo(-h * 0.55, h * 0.55); c.stroke(); }
    else if (name === "bulb") {
      c.beginPath(); c.arc(0, -h * 0.2, h * 0.55, Math.PI * 0.8, Math.PI * 2.2); c.lineTo(h * 0.25, h * 0.45); c.lineTo(-h * 0.25, h * 0.45); c.closePath(); c.stroke();
      c.beginPath(); c.moveTo(-h * 0.25, h * 0.7); c.lineTo(h * 0.25, h * 0.7); c.stroke();
    } else if (name === "back") { c.beginPath(); c.moveTo(h * 0.3, -h * 0.65); c.lineTo(-h * 0.4, 0); c.lineTo(h * 0.3, h * 0.65); c.stroke(); }
    else if (name === "lock") {
      c.beginPath(); c.arc(0, -h * 0.25, h * 0.38, Math.PI, 0); c.stroke();
      roundRect(c, -h * 0.6, -h * 0.2, h * 1.2, h * 0.95, h * 0.15); c.fill();
    } else if (name === "gear") {
      for (let i = 0; i < 8; i++) { c.save(); c.rotate(i * Math.PI / 4); c.fillRect(-h * 0.14, -h * 0.85, h * 0.28, h * 0.4); c.restore(); }
      c.beginPath(); c.arc(0, 0, h * 0.55, 0, Math.PI * 2); c.fill();
      c.globalCompositeOperation = "destination-out"; c.beginPath(); c.arc(0, 0, h * 0.22, 0, Math.PI * 2); c.fill();
    } else if (name === "ad") {
      roundRect(c, -h * 0.8, -h * 0.55, h * 1.6, h * 1.1, h * 0.2); c.stroke();
      c.beginPath(); c.moveTo(-h * 0.2, -h * 0.3); c.lineTo(h * 0.35, 0); c.lineTo(-h * 0.2, h * 0.3); c.closePath(); c.fill();
    } else if (name === "bag") {
      roundRect(c, -h * 0.65, -h * 0.25, h * 1.3, h * 1.0, h * 0.15); c.fill();
      c.beginPath(); c.arc(0, -h * 0.25, h * 0.35, Math.PI, 0); c.stroke();
    } else if (name === "band") {
      c.beginPath(); c.moveTo(-h * 0.8, -h * 0.2); c.quadraticCurveTo(0, h * 0.7, h * 0.8, -h * 0.2); c.stroke();
      c.beginPath(); c.arc(-h * 0.8, -h * 0.2, h * 0.22, 0, Math.PI * 2); c.arc(h * 0.8, -h * 0.2, h * 0.22, 0, Math.PI * 2); c.fill();
    } else if (name === "eye") {
      c.beginPath(); c.moveTo(-h * 0.85, 0); c.quadraticCurveTo(0, -h * 0.8, h * 0.85, 0); c.quadraticCurveTo(0, h * 0.8, -h * 0.85, 0); c.stroke();
      c.beginPath(); c.arc(0, 0, h * 0.25, 0, Math.PI * 2); c.fill();
    } else if (name === "sound" || name === "music") {
      if (name === "sound") { c.beginPath(); c.moveTo(-h * 0.7, -h * 0.25); c.lineTo(-h * 0.35, -h * 0.25); c.lineTo(h * 0.05, -h * 0.6); c.lineTo(h * 0.05, h * 0.6); c.lineTo(-h * 0.35, h * 0.25); c.lineTo(-h * 0.7, h * 0.25); c.closePath(); c.fill(); c.beginPath(); c.arc(h * 0.15, 0, h * 0.45, -0.8, 0.8); c.stroke(); }
      else { c.beginPath(); c.arc(-h * 0.3, h * 0.45, h * 0.22, 0, Math.PI * 2); c.fill(); c.beginPath(); c.moveTo(-h * 0.1, h * 0.45); c.lineTo(-h * 0.1, -h * 0.65); c.lineTo(h * 0.55, -h * 0.45); c.stroke(); }
    } else if (name === "coin") { c.restore(); drawCoin(ctx, x, y, h * 0.8); return;
    } else if (name === "star") { c.restore(); drawStar(ctx, x, y, h * 0.85, true); return;
    } else if (name === "help") { text("?", 0, 1, s * 0.95, color); }
    c.restore();
  }

  // Immediate-mode button: draws and registers for input this frame.
  function button(x, y, w, h, label, o, onClick) {
    o = o || {};
    const key = o.key || (label + "|" + Math.round(x) + "|" + Math.round(y));
    const pressed = ui.pressed && ui.pressed.key === key && ui.pointer.down;
    const dy = pressed ? 2 : 0;
    const base = o.color || "#f6efe2";
    const fg = o.fg || "#3a2714";
    ctx.save();
    if (o.disabled) ctx.globalAlpha = 0.55;
    roundRect(ctx, x, y + 3, w, h, o.r || 12);
    ctx.fillStyle = "rgba(30,20,10,0.25)";
    ctx.fill();
    roundRect(ctx, x, y + dy, w, h, o.r || 12);
    ctx.fillStyle = base;
    ctx.fill();
    ctx.strokeStyle = "rgba(40,25,10,0.22)";
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.22)";
    roundRect(ctx, x + 3, y + dy + 2, w - 6, h * 0.4, (o.r || 12) - 3);
    ctx.fill();
    const size = o.size || 16;
    if (o.icon && label) {
      ctx.font = "bold " + size + "px " + FONT;
      const tw = ctx.measureText(label).width;
      const iw = size * 1.1;
      const total = iw + 6 + tw;
      icon(o.icon, x + w / 2 - total / 2 + iw / 2, y + dy + h / 2, iw, fg);
      text(label, x + w / 2 - total / 2 + iw + 6, y + dy + h / 2 + 1, size, fg, "left");
    } else if (o.icon) icon(o.icon, x + w / 2, y + dy + h / 2, o.iconSize || size * 1.2, fg);
    else text(label, x + w / 2, y + dy + h / 2 + 1, size, fg);
    ctx.restore();
    ui.buttons.push({ x: x, y: y, w: w, h: h, key: key, onClick: onClick || function () {}, disabled: !!o.disabled, onDisabled: o.onDisabled, label: o.name || label });
  }

  function coinPill(x, y, onClick) {
    const label = String(save.coins);
    ctx.font = "bold 17px " + FONT;
    const w = Math.max(80, ctx.measureText(label).width + 52);
    const bx = x - w;
    button(bx, y, w, 36, "", { key: "coins", name: "coins", color: "#fff6d8", r: 18 }, onClick);
    drawCoin(ctx, bx + 19, y + 18, 11);
    text(label, bx + 36, y + 19, 17, "#5a3d0c", "left");
    text("+", bx + w - 14, y + 18, 18, "#b9860c");
  }

  function panel(x, y, w, h, title) {
    ctx.save();
    roundRect(ctx, x, y + 5, w, h, 18);
    ctx.fillStyle = "rgba(20,12,4,0.3)";
    ctx.fill();
    roundRect(ctx, x, y, w, h, 18);
    ctx.fillStyle = "#fbf5ea";
    ctx.fill();
    ctx.strokeStyle = "rgba(60,40,20,0.25)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    if (title) {
      roundRect(ctx, x, y, w, 52, 18);
      ctx.save(); ctx.clip();
      ctx.fillStyle = theme.accent;
      ctx.fillRect(x, y, w, 52);
      ctx.restore();
      text(title, x + w / 2, y + 27, 22, "#fff");
    }
    ctx.restore();
  }

  // ---------- world drawing in play ----------
  function extendRect(r) {
    // Platforms touching the design edges continue into the letterbox margins.
    const L = -ox / scale - 2, R = W + ox / scale + 2, B = H + oy / scale + 2;
    const o = {};
    for (const k in r) o[k] = r[k];
    if (r.x <= 0) { o.w += o.x - L; o.x = L; }
    if (r.x + r.w >= W) o.w = R - o.x;
    if (r.y + r.h >= H) o.h = B - o.y;
    return o;
  }

  function hintPairs() {
    const s = ui.session;
    if (!s) return [];
    const L = LEVELS[s.idx];
    const n = s.usedSolution ? L.solution.length : Math.min(hintCount(s.id), L.solution.length);
    return L.solution.slice(0, n);
  }
  function hasBand(i, j) { return state.bands.some(function (b) { return (b.i === i && b.j === j) || (b.i === j && b.j === i); }); }

  function drawPlayWorld() {
    const L = state.level;
    const c = ctx;
    for (let i = 0; i < L.spikes.length; i++) drawSpikes(c, L.spikes[i].y + L.spikes[i].h >= H ? extendRect(L.spikes[i]) : L.spikes[i]);
    for (let i = 0; i < state.solids.length; i++) drawSolid(c, extendRect(state.solids[i]), theme);
    // goal glow
    const g = goalSolid();
    if (g && !g.gone) {
      c.save();
      c.fillStyle = "rgba(255,230,120," + (0.25 + 0.1 * Math.sin(time * 3)) + ")";
      roundRect(c, g.x + 4, g.y - 5, g.w - 8, 6, 3);
      c.fill();
      c.restore();
    }
    drawFlag(c, L.goal);
    // hints
    const hp = hintPairs();
    let nextHint = null;
    for (let k = 0; k < hp.length; k++) {
      const a = L.pegs[hp[k][0]], b = L.pegs[hp[k][1]];
      const placed = hasBand(hp[k][0], hp[k][1]);
      if (!placed && !nextHint) nextHint = hp[k];
      if (state.mode !== "build") continue;
      c.save();
      c.setLineDash([8, 7]);
      c.lineDashOffset = -time * 30;
      c.strokeStyle = placed ? "rgba(90,160,90,0.5)" : "rgba(240,170,20,0.9)";
      c.lineWidth = 4;
      c.lineCap = "round";
      c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
      c.setLineDash([]);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      c.beginPath(); c.arc(mx, my, 11, 0, Math.PI * 2);
      c.fillStyle = placed ? "#5aa05a" : "#f0a814"; c.fill();
      c.restore();
      text(String(k + 1), mx, my + 1, 13, "#fff");
    }
    // bands
    for (let b = 0; b < state.bands.length; b++) {
      const band = state.bands[b];
      const st = bandStrain(band);
      drawBandPoly(c, band.nodes, strainColor(st), 7, st >= RED_AT && state.mode === "run");
    }
    for (let i = 0; i < state.snaps.length; i++) {
      const s = state.snaps[i];
      const t = s.life / 0.35;
      c.save();
      c.globalAlpha = t;
      c.strokeStyle = "#c44530"; c.lineWidth = 5 * t; c.lineCap = "round";
      c.beginPath(); c.moveTo(s.x1, s.y1); c.lineTo(lerp(s.x1, s.x2, t), lerp(s.y1, s.y2, t) + (1 - t) * 30); c.stroke();
      c.restore();
    }
    // drag preview
    const dr = ui.dragging;
    if (dr && state.mode === "build") {
      const a = L.pegs[dr.from];
      const hv = pegAt(dr.x, dr.y, L);
      const tx = hv >= 0 && hv !== dr.from ? L.pegs[hv].x : dr.x;
      const ty = hv >= 0 && hv !== dr.from ? L.pegs[hv].y : dr.y;
      const st = straightStrain(a.x, a.y, tx, ty);
      const blocked = bandBlocked(a, { x: tx, y: ty }, L) || bandHitsStart(a, { x: tx, y: ty }, L);
      drawComfortCircle(c, a, st > 1);
      if (st >= SNAP_RATIO || blocked) {
        c.save(); c.setLineDash([6, 6]); c.strokeStyle = "rgba(196,69,48,0.8)"; c.lineWidth = 4;
        c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(tx, ty); c.stroke(); c.restore();
      } else drawBandPoly(c, previewNodes(a.x, a.y, tx, ty), strainColor(st, 0.85), 7, st >= RED_AT);
      const label = blocked ? (bandHitsStart(a, { x: tx, y: ty }, L) ? "Pip is in the way" : "Blocked by ground") : st >= SNAP_RATIO ? "Too far!" : st >= RED_AT ? "Red: snaps under Pip" : st >= YELLOW_AT ? "Yellow: bouncy" : st >= 0.95 ? "Green: walkable" : "Slack: sags";
      const lx = clamp((a.x + tx) / 2, 70, W - 70), ly = clamp(Math.min(a.y, ty) - 26, 70, H - 70);
      c.save(); roundRect(c, lx - 72, ly - 12, 144, 24, 12); c.fillStyle = "rgba(255,250,240,0.92)"; c.fill(); c.restore();
      text(label, lx, ly + 1, 12, blocked || st >= RED_AT ? "#a8321f" : st >= YELLOW_AT ? "#9a6a00" : "#2f6b34");
    }
    // pegs
    for (let i = 0; i < L.pegs.length; i++) {
      const isHint = !!(nextHint && (nextHint[0] === i || nextHint[1] === i)) && state.mode === "build";
      const glow = ui.hoverPeg === i || (dr && dr.from === i) || ui.selPeg === i;
      drawPeg(c, L.pegs[i], glow, isHint);
      if (ui.selPeg === i) {
        c.save(); c.strokeStyle = theme.accent; c.lineWidth = 2.5; c.setLineDash([4, 4]); c.lineDashOffset = time * 20;
        c.beginPath(); c.arc(L.pegs[i].x, L.pegs[i].y, 17, 0, Math.PI * 2); c.stroke(); c.restore();
      }
    }
    drawPip(c, state.pip, state.mode);
    for (let i = 0; i < state.particles.length; i++) {
      const p = state.particles[i];
      c.globalAlpha = clamp(p.life / p.max, 0, 1);
      c.fillStyle = p.color;
      c.beginPath(); c.arc(p.x, p.y, p.r, 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1;
    for (let i = 0; i < state.floaters.length; i++) {
      const f = state.floaters[i];
      c.globalAlpha = clamp(f.life, 0, 1);
      text(f.text, f.x, f.y, 18, "#3a2714");
    }
    c.globalAlpha = 1;
  }

  function drawPlayHud() {
    const s = ui.session, L = state.level;
    // top bar
    ctx.save();
    ctx.fillStyle = "rgba(255,250,240,0.82)";
    roundRect(ctx, 6, 6, W - 12, 50, 14);
    ctx.fill();
    ctx.restore();
    button(12, 11, 40, 40, "", { icon: "pause", name: "pause", r: 10, key: "pause" }, function () { ui.modal = { type: "pause" }; });
    text(L.id + "  " + L.name, 62, 24, 16, theme.ink, "left");
    const budget = state.budget, used = state.mode === "build" ? state.bands.length : state.goUsed;
    let bx = 62;
    for (let k = 0; k < budget; k++) {
      const filled = k < used;
      ctx.save();
      ctx.strokeStyle = filled ? "rgba(90,70,50,0.35)" : (k >= L.budget ? "#3a8fd8" : "#56a85c");
      ctx.lineWidth = 4; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(bx, 40); ctx.quadraticCurveTo(bx + 9, 48, bx + 18, 40); ctx.stroke();
      ctx.restore();
      bx += 24;

    text("BRIDGE", 2, 51, 54, "rgba(60,30,10,0.25)");
    text("BRIDGE", 0, 48, 54, "#3a2714");
    ctx.restore();
    // a little scene: band with Pip bouncing
    const t = time;
    const bounce = Math.abs(Math.sin(t * 2.2));
    const pegA = { x: 90, y: 360 }, pegB = { x: 310, y: 360 };
    const dip = (1 - bounce) * 36 + 8;
    const nodes = [];
    for (let i = 0; i <= 12; i++) { const u = i / 12; nodes.push({ x: lerp(pegA.x, pegB.x, u), y: pegA.y + Math.sin(u * Math.PI) * dip }); }
    ctx.save();
    roundRect(ctx, 30, 360, 80, 30, 6); ctx.fillStyle = theme.plat[1]; ctx.fill();
    roundRect(ctx, 290, 360, 80, 30, 6); ctx.fill();
    ctx.restore();
    drawBandPoly(ctx, nodes, strainColor(1.3), 7, false);
    drawPeg(ctx, pegA, false, false);
    drawPeg(ctx, pegB, false, false);
    drawPip(ctx, { x: W / 2, y: 360 + dip - 16 - bounce * 110, r: 16, facing: 1, squash: 1 + (bounce < 0.15 ? 0.15 : 0) - (bounce > 0.8 ? 0.05 : 0), alive: true, walkPhase: 0 }, "build");

    const w = ui.world;

    for (let k = 0; k < 10; k++) {

  function drawComplete() {
    const m = ui.modal;
    const s = ui.session, L = LEVELS[s.idx];
    panel(30, 130, 340, 450, "Level complete!");
    text(L.id + "  " + L.name, W / 2, 210, 17, theme.ink);
    for (let k = 0; k < 3; k++) {
      const appear = clamp((m.t - 0.35 - k * 0.26) * 5, 0, 1);
      const on = k < m.stars && appear > 0;
      const sz = 26 * (on ? 0.6 + 0.4 * appear + (appear < 1 ? 0.3 * Math.sin(appear * Math.PI) : 0) : 1);
      drawStar(ctx, W / 2 - 64 + k * 64, 270 - (k === 1 ? 10 : 0), sz, on);
    }
    text("Bands used: " + state.goUsed + "   (par " + L.par + ")", W / 2, 322, 14, theme.ink, "center", "normal");
    let note = "";
    if (m.raw > m.stars) note = "Help used this visit: best is " + m.stars + (m.stars === 1 ? " star" : " stars") + ".";
    else if (m.stars < 3) note = "Use " + L.par + (L.par === 1 ? " band" : " bands") + " for 3 stars.";
    if (note) text(note, W / 2, 344, 13, "rgba(60,40,20,0.75)", "center", "normal");
    ctx.save(); roundRect(ctx, 90, 364, 220, 52, 26); ctx.fillStyle = "#fff6d8"; ctx.fill(); ctx.restore();
    const shownPay = Math.round(m.pay * clamp((m.t - 0.4 - m.stars * 0.26) * 3, 0, 1));
    drawCoin(ctx, 118, 390, 14);
    if (m.pay > 0) text("+" + shownPay + " coins", 140, 391, 20, "#5a3d0c", "left");
    else text(m.wasCleared ? "Replay: beat your stars for coins" : "+0", 140, 391, 12, "#5a3d0c", "left", "normal");
    const hasNext = s.idx + 1 < LEVELS.length;
    button(50, 434, 300, 54, hasNext ? (LEVELS[s.idx + 1].world !== L.world ? "Next world!" : "Next level") : "Finish!", { icon: "play", name: "next", color: "#6cbf5f", fg: "#fff", size: 19 }, nextLevel);
    button(50, 500, 145, 46, "Replay", { icon: "undo", name: "replay" }, function () { setScreen(function () { startLevel(s.idx); }); });
    button(205, 500, 145, 46, "Levels", { name: "levels" }, function () { setScreen(function () { ui.modal = null; ui.screen = "levels"; state.mode = "build"; }); });
  }

  function drawNewWorld() {
    const m = ui.modal;
    const th = THEMES[m.world];
    panel(40, 200, 320, 300, "New world unlocked!");
    text((m.world + 1) + ". " + th.name, W / 2, 290, 24, th.ink);
    text(th.sub, W / 2, 322, 16, th.ink, "center", "normal");
    wrap("New parts to play with. Read the tip at the top of each level.", W / 2, 360, 260, 20, 14, th.ink, "center");
    button(110, 430, 180, 48, "Let's go", { name: "lets go", color: "#6cbf5f", fg: "#fff", size: 17 }, closeModal);
  }

  function drawEnding() {
    panel(30, 170, 340, 380, "You did it!");
    text("All " + LEVELS.length + " levels cleared", W / 2, 260, 20, theme.ink);
    drawStar(ctx, W / 2 - 40, 310, 14, true);
    text(totalStars() + " / " + LEVELS.length * 3, W / 2 - 22, 311, 20, theme.ink, "left");
    wrap("Pip made it home through every world. Go back for any stars you missed, or try the levels with fewer bands.", W / 2, 360, 280, 20, 14, theme.ink, "center");
    button(110, 470, 180, 48, "Yay!", { name: "yay", color: "#6cbf5f", fg: "#fff", size: 17 }, closeModal);
  }

  // ---------- main loop ----------
  function update(dt) {
    if (ui.fadeDir === 1) {
      ui.fade = Math.min(1, ui.fade + dt * 6);
      if (ui.fade >= 1) {
        const fn = ui.pending; ui.pending = null;
        ui.fadeDir = -1;
        ui.dragging = null; ui.selPeg = -1; ui.pressed = null;
        sfx.stopStretch(false);
        if (fn) fn();
      }
    } else if (ui.fadeDir === -1) {
      ui.fade = Math.max(0, ui.fade - dt * 5);
      if (ui.fade <= 0) ui.fadeDir = 0;
    }
    if (ui.toast) { ui.toast.t -= dt; if (ui.toast.t <= 0) ui.toast = null; }
    if (ui.modal && ui.modal.type === "complete") ui.modal.t += dt;
    if (ui.screen === "play") {
      const s = ui.session;
      const paused = ui.modal && ui.modal.type !== "complete";
      if (!paused) {
        ui.bannerT += dt;
        const steps = ui.speed;
        for (let k = 0; k < steps; k++) {
          stepWorld(DT);
          if (s.solAnim && state.mode === "build") {
            s.solAnim.t -= DT;
            if (s.solAnim.t <= 0) {
              const L = LEVELS[s.idx];
              const pr = L.solution[s.solAnim.k];
              if (pr) { placeBand(pr[0], pr[1]); s.solAnim.k += 1; s.solAnim.t = 0.55; }
              else { s.solAnim = null; toast("That's the answer. Press GO!", 2.6); }
            }
          }
          if (state.mode === "win" && s.winWait > 0) {
            s.winWait -= DT;
            if (s.winWait <= 0) { s.winWait = -1; completeLevel(); break; }
          }
        }
      }
    } else {
      time += dt;
    }
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = theme.outer;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const sx = ui.screen === "play" && state.shake ? (Math.random() - 0.5) * state.shake : 0;
    const sy = ui.screen === "play" && state.shake ? (Math.random() - 0.5) * state.shake : 0;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, (ox + sx * scale) * dpr, (oy + sy * scale) * dpr);
    ui.buttons = [];
    // Fill the letterbox margins with the current backdrop so wide screens look intentional.
    if (ui.screen === "levels") theme = themeFor(ui.world);
    if (ui.screen === "title") theme = THEMES[0];
    ctx.save();
    ctx.translate(-ox / scale, -oy / scale);
    drawBackdrop(ctx, ui.screen === "title" || ui.screen === "worlds" ? THEMES[0] : theme, vw / scale, vh / scale, time);
    ctx.restore();
    if (ui.screen === "title") drawTitle();
    else if (ui.screen === "worlds") drawWorlds();
    else if (ui.screen === "levels") drawLevels();
    else if (ui.screen === "play") { drawPlayWorld(); drawPlayHud(); }
    if (ui.modal) { ui.buttons = []; drawModal(); }
    if (ui.toast) {
      const a = clamp(ui.toast.t * 3, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = "bold 14px " + FONT;
      const lines = Math.ceil(ctx.measureText(ui.toast.text).width / 300);
      const h = 22 + lines * 18;
      roundRect(ctx, 30, 600 - h, W - 60, h, 14);
      ctx.fillStyle = "rgba(40,28,16,0.9)";
      ctx.fill();
      wrap(ui.toast.text, W / 2, 600 - h + 20, W - 90, 18, 14, "#fff", "center", "bold");
      ctx.restore();
    }
    if (ui.fade > 0) {
      ctx.save();
      ctx.globalAlpha = ui.fade;
      ctx.fillStyle = theme.outer;
      ctx.fillRect(-ox / scale - 2, -oy / scale - 2, vw / scale + 4, vh / scale + 4);
      ctx.restore();
    }
  }

  function frame(ts) {
    try {
      const dt = ui.lastTs ? Math.min(0.05, (ts - ui.lastTs) / 1000) : DT;
      ui.lastTs = ts;
      if (ui.screen === "play") {
        ui.acc += dt;
        let n = 0;
        while (ui.acc >= DT && n < 4) { update(DT); ui.acc -= DT; n++; }
        if (n >= 4) ui.acc = 0;
      } else update(dt);
      render();
      ui.frame++;
    } catch (err) {
      ui.errors++;
      if (ui.errors < 5 && window.console) console.error(err);
    }
    requestAnimationFrame(frame);
  }

  // ---------- test hooks (harmless in production) ----------
  window.__RBB = {
    get state() { return state; },
    get ui() { return ui; },
    get save() { return save; },
    LEVELS: LEVELS, PRICES: PRICES, REWARD: REWARD, PACKS: PACKS, AD_DAILY_CAP: AD_DAILY_CAP, START_COINS: START_COINS,
    design: function () { return { scale: scale, ox: ox, oy: oy }; },
    buttons: function () { return ui.buttons.map(function (b) { return { label: b.label, x: b.x, y: b.y, w: b.w, h: b.h, disabled: b.disabled }; }); },
    startLevel: function (i) { startLevel(i); },
    setScreen: function (s) { ui.screen = s; ui.modal = null; },
    openModal: function (t) { ui.modal = { type: t }; },
    placeBand: placeBand, go: function () { return pressGo(); },
    useHint: useHint, useExtra: useExtra, useSolution: useSolution, watchAd: doAd, buy: function (k) { doBuy(PACKS[k]); },
    simulate: function (i, pairs) { const L = LEVELS[i]; const r = simulate(L, pairs || L.solution); return r; },
    setSpeed: function (n) { ui.speed = Math.max(1, Math.floor(n)); },
    reload: loadSave,
  };

  loadSave();
  resize();
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
