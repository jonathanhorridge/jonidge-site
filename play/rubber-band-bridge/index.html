(function(){
  try {
    var t = localStorage.getItem("jonidge-play-v1") || "";
    if (!/^v1\.[0-9a-f]{128}$/i.test(t)) {
      location.replace("/play/");
      return;
    }
    var s = document.getElementById("jonidge-gate-css");
    if (s) s.remove();
  } catch (e) {
    location.replace("/play/");
  }
})();
</script>

<body>
<canvas id="game" aria-label="Rubber Band Bridge game"></canvas>
<script>
// Rubber Band Bridge v3 by Jonidge (jonidge@yahoo.com). Single file, no external assets.
(function () {
  "use strict";
  // ===== core.js: constants, simulation state and physics (no DOM) =====
  const W = 400;
  const H = 720;
  const NATURAL = 128;
  const SNAP_RATIO = 1.76;
  const YELLOW_AT = 1.22;
  const RED_AT = 1.48;
  const SEGMENTS = 12;
  const PIP_R = 16;
  const PEG_R = 11;
  const PEG_HIT = 30;
  const BAND_HALF = 6;
  const GRAVITY = 1800;
  const WALK_SPEED = 110;
  const WALK_ACCEL = 620;
  const AIR_DRAG = 0.12;
  const GROUND_FRICTION = 4.2;
  const MAX_SUB_PX = 4.5;
  const SOLID_RESTI = 0.2;
  const FLOOR_RESTI = 0.04;
  const STEP_UP = 24;
  const DT = 1 / 60;
  const RUN_TIMEOUT = 22;     // seconds before a run is called off
  const STUCK_TIME = 2.2;     // seconds with no progress => stuck
  const CRUMBLE_TIME = 0.55;  // seconds standing on a crumbly plank
  const SPRING_POWER = 1100;  // launch speed of a spring pad

  let time = 0;

  const hooks = {
    onWin: function () {},
    onFail: function () {},
    onFailDone: function () { restartKeepLayout(); },
  };

  const state = {
    level: null,
    solids: [],
    mode: "build", // build, run, fail, win
    bands: [],
    ghosts: [],
    pip: null,
    budget: 0,
    extraBands: 0,
    goUsed: 0,
    floaters: [],
    particles: [],
    snaps: [],
    shake: 0,
    snapCount: 0,
    lastKick: null,
    failTimer: 0,
    failReason: "",
    runTime: 0,
    stuckT: 0,
    stuckX: 0,
    stuckY: 0,
    maxPen: 0,
  };

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function dist(ax, ay, bx, by) { return Math.hypot(bx - ax, by - ay); }

  function currentLevel() { return state.level; }

  function pegDist(i, j, level) {
    const a = level.pegs[i], b = level.pegs[j];
    return dist(a.x, a.y, b.x, b.y);
  }

  // ----- Bands -----
  function makeBand(i, j, level) {
    const a = level.pegs[i], b = level.pegs[j];
    const nodes = [];
    for (let s = 0; s <= SEGMENTS; s++) {
      const t = s / SEGMENTS;
      const x = lerp(a.x, b.x, t);
      const y = lerp(a.y, b.y, t);
      nodes.push({ x: x, y: y, px: x, py: y, pinned: s === 0 || s === SEGMENTS });
    }
    return { i: i, j: j, nodes: nodes, rest: NATURAL / SEGMENTS, alive: true };
  }

  function bandLength(band) {
    let len = 0;
    for (let i = 1; i < band.nodes.length; i++) {
      const a = band.nodes[i - 1], b = band.nodes[i];
      len += dist(a.x, a.y, b.x, b.y);
    }
    return len;
  }
  function bandStrain(band) { return bandLength(band) / NATURAL; }
  function straightStrain(x1, y1, x2, y2) { return dist(x1, y1, x2, y2) / NATURAL; }
  function bandMid(band) {
    const m = band.nodes[band.nodes.length >> 1];
    return { x: m.x, y: m.y };
  }

  // ----- Pip -----
  function resetPip() {
    const L = currentLevel();
    state.pip = {
      x: L.start.x, y: L.start.y, vx: 0, vy: 0, r: PIP_R,
      onGround: true, facing: 1, walkPhase: 0, squash: 1,
      alive: true, onBand: null, bounceLock: 0, onSolid: null,
    };
  }

  function clearSimBits() {
    state.particles = [];
    state.snaps = [];
    state.floaters = [];
    state.shake = 0;
    state.snapCount = 0;
    state.lastKick = null;
    state.failTimer = 0;
    state.failReason = "";
    state.runTime = 0;
    state.stuckT = 0;
    state.maxPen = 0;
  }

  function cloneSolids(level) {
    return level.platforms.map(function (p) {
      const o = {};
      for (const k in p) o[k] = p[k];
      o.crumbleT = 0;
      o.gone = false;
      return o;
    });
  }

  // Load a level object into the simulation. extra = purchased extra bands.
  function loadLevelData(level, keepGhosts, extra) {
    state.level = level;
    state.solids = cloneSolids(level);
    state.mode = "build";
    state.bands = [];
    state.extraBands = extra || 0;
    state.budget = level.budget + state.extraBands;
    state.goUsed = 0;
    if (!keepGhosts) state.ghosts = [];
    clearSimBits();
    resetPip();
  }

  function bandsUsed() { return state.bands.length; }

  function canPlace(i, j, level) {
    level = level || currentLevel();
    if (state.mode !== "build") return false;
    if (i === j || i < 0 || j < 0 || i >= level.pegs.length || j >= level.pegs.length) return false;
    if (state.bands.some(function (b) { return (b.i === i && b.j === j) || (b.i === j && b.j === i); })) return false;
    if (state.bands.length >= state.budget) return "budget";
    const s = pegDist(i, j, level) / NATURAL;
    if (s >= SNAP_RATIO) return "snap";
    if (bandBlocked(level.pegs[i], level.pegs[j], level)) return "blocked";
    if (bandHitsStart(level.pegs[i], level.pegs[j], level)) return "pip";
    return true;
  }

  // A band may not be stretched right through Pip's starting spot.
  function bandHitsStart(a, b, level) {
    const p = closestPoint(a, b, level.start.x, level.start.y);
    return dist(p.x, p.y, level.start.x, level.start.y) < PIP_R - 3;
  }

  // A band may not be stretched through solid ground. The first and last
  // 20 px are ignored so pegs sitting on an edge still work.
  function bandBlocked(a, b, level) {
    const len = dist(a.x, a.y, b.x, b.y);
    const n = Math.max(2, Math.ceil(len / 4));
    const plats = level.platforms;
    for (let k = 0; k <= n; k++) {
      const d = len * k / n;
      if (d < 20 || d > len - 20) continue;
      const x = lerp(a.x, b.x, k / n), y = lerp(a.y, b.y, k / n);
      for (let q = 0; q < plats.length; q++) {
        const r = plats[q];
        if (x > r.x + 3 && x < r.x + r.w - 3 && y > r.y + 3 && y < r.y + r.h - 3) return true;
      }
    }
    return false;
  }

  function placeBand(i, j) {
    const level = currentLevel();
    const ok = canPlace(i, j, level);
    const mx = (level.pegs[i] ? level.pegs[i].x : 0) / 2 + (level.pegs[j] ? level.pegs[j].x : 0) / 2;
    const my = (level.pegs[i] ? level.pegs[i].y : 0) / 2 + (level.pegs[j] ? level.pegs[j].y : 0) / 2;
    if (ok === "snap") {
      sfx.snap();
      addFloater(mx, my - 20, "Too tight!");
      burst(mx, my, "#c44530", 14);
      state.shake = 8;
      return false;
    }
    if (ok === "blocked") {
      sfx.deny();
      addFloater(mx, my - 20, "Can't go through ground");
      return false;
    }
    if (ok === "pip") {
      sfx.deny();
      addFloater(mx, my - 20, "Pip is in the way");
      return false;
    }
    if (ok === "budget") {
      sfx.deny();
      addFloater(mx, my - 20, "No bands left");
      return false;
    }
    if (!ok) return false;
    state.bands.push(makeBand(i, j, level));
    sfx.hook();
    return true;
  }

  function removeBandAt(index) {
    if (state.mode !== "build") return false;
    if (index < 0 || index >= state.bands.length) return false;
    state.bands.splice(index, 1);
    sfx.click();
    return true;
  }

  function undo() {
    if (state.mode !== "build") return false;
    if (!state.bands.length) return false;
    state.bands.pop();
    sfx.click();
    return true;
  }

  function addFloater(x, y, text) {
    state.floaters.push({ x: x, y: y, text: text, life: 1, vy: -26 });
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 180;
      state.particles.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
        life: 0.5 + Math.random() * 0.4, max: 0.7, color: color, r: 1.5 + Math.random() * 2.5,
      });
    }
  }

  function closestPoint(a, b, px, py) {
    const abx = b.x - a.x, aby = b.y - a.y;
    const t = clamp(((px - a.x) * abx + (py - a.y) * aby) / (abx * abx + aby * aby || 1), 0, 1);
    return { x: a.x + abx * t, y: a.y + aby * t, t: t };
  }

  function snapBand(band) {
    if (!band.alive) return;
    band.alive = false;
    const mid = bandMid(band);
    const strain = Math.max(1, bandStrain(band));
    sfx.snap();
    state.snapCount += 1;
    state.shake = 12 + (strain - 1) * 10;
    addFloater(mid.x, mid.y - 16, "SNAP!");
    burst(mid.x, mid.y, "#d14b3a", 22);
    const a = band.nodes[0], b = band.nodes[band.nodes.length - 1];
    state.snaps.push(
      { x1: a.x, y1: a.y, x2: mid.x, y2: mid.y, life: 0.35 },
      { x1: b.x, y1: b.y, x2: mid.x, y2: mid.y, life: 0.35 }
    );
    const pip = state.pip;
    if (pip && pip.alive) {
      let closest = 1e9;
      for (let i = 1; i < band.nodes.length; i++) {
        const p = closestPoint(band.nodes[i - 1], band.nodes[i], pip.x, pip.y);
        const d = dist(pip.x, pip.y, p.x, p.y);
        if (d < closest) closest = d;
      }
      if (closest < 120) {
        const pa = band.nodes[0], pb = band.nodes[band.nodes.length - 1];
        const steep = Math.abs(pb.y - pa.y) > Math.abs(pb.x - pa.x) * 0.65;
        const fallIn = pip.vy;
        // Walkway snaps drop Pip. A real fall onto a tight band turns the
        // snap into a Snap Launch: up and a little forward.
        if (fallIn > 160 && (steep || fallIn > 240)) {
          const energy = clamp(strain - 1, 0, 1.2);
          const kick = 800 + energy * 760;
          pip.vx = 0.13 * kick;
          pip.vy = -0.98 * kick;
          state.lastKick = { kick: Math.round(kick), x: pip.x, y: pip.y, kind: "launch" };
          sfx.launch();
        } else {
          pip.vx *= 0.45;
          pip.vy = Math.max(pip.vy, 140);
          state.lastKick = { x: pip.x, y: pip.y, kind: "drop" };
        }
        pip.onGround = false;
        pip.bounceLock = 0.18;
        pip.squash = 1.3;
      }
    }
    const idx = state.bands.indexOf(band);
    if (idx >= 0) state.bands.splice(idx, 1);
  }

  // ----- Physics -----
  function stepBand(band, dt) {
    const level = currentLevel();
    const pa = level.pegs[band.i], pb = level.pegs[band.j];
    const nodes = band.nodes;
    const n = nodes.length;
    for (let i = 1; i < n - 1; i++) {
      const nd = nodes[i];
      const vx = (nd.x - nd.px) * 0.985;
      const vy = (nd.y - nd.py) * 0.985;
      nd.px = nd.x;
      nd.py = nd.y;
      nd.x += vx;
      nd.y += vy + GRAVITY * 0.22 * dt * dt;
    }
    nodes[0].x = pa.x; nodes[0].y = pa.y;
    nodes[n - 1].x = pb.x; nodes[n - 1].y = pb.y;
    const rest = band.rest;
    for (let k = 0; k < 10; k++) {
      for (let i = 0; i < n - 1; i++) {
        const A = nodes[i], B = nodes[i + 1];
        const dx = B.x - A.x, dy = B.y - A.y;
        const d = Math.hypot(dx, dy) || 0.0001;
        const diff = (d - rest) / d;
        const inv = (A.pinned ? 0 : 1) + (B.pinned ? 0 : 1);
        if (!inv) continue;
        const s = 0.55 * diff / inv;
        if (!A.pinned) { A.x += dx * s; A.y += dy * s; }
        if (!B.pinned) { B.x -= dx * s; B.y -= dy * s; }
      }
      nodes[0].x = pa.x; nodes[0].y = pa.y;
      nodes[n - 1].x = pb.x; nodes[n - 1].y = pb.y;
    }
    if (bandStrain(band) >= SNAP_RATIO) snapBand(band);
  }

  function applySolidHit(pip, nx, ny, r) {
    const vn = pip.vx * nx + pip.vy * ny;
    if (r && r.kind === "spring" && ny < -0.65) {
      // Spring pad: straight up, a little forward.
      pip.vy = -SPRING_POWER;
      pip.vx = Math.max(pip.vx, 90);
      pip.onGround = false;
      pip.squash = 1.35;
      r.pressT = 0.25;
      sfx.spring();
      return;
    }
    if (vn < 0) {
      const resti = (ny < -0.65) ? FLOOR_RESTI : SOLID_RESTI;
      pip.vx -= vn * nx * (1 + resti);
      pip.vy -= vn * ny * (1 + resti);
    }
    if (ny < -0.55 && pip.vy >= -60) {
      pip.onGround = true;
      pip.onSolid = r || null;
      if (pip.vy > 0) pip.vy = 0;
      pip.squash = 0.9;
    }
  }

  function rangeOverlap(a1, a2, b1, b2) { return Math.min(a2, b2) - Math.max(a1, b1); }

  function resolvePlatformAxis(pip, ox, oy, axis) {
    const solids = state.solids;
    const rad = pip.r;
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 0; i < solids.length; i++) {
        const r = solids[i];
        if (r.gone) continue;
        const xOv = rangeOverlap(pip.x - rad, pip.x + rad, r.x, r.x + r.w);
        const yOv = rangeOverlap(pip.y - rad, pip.y + rad, r.y, r.y + r.h);
        if (xOv <= 0 || yOv <= 0) continue;
        if (axis === "x") {
          const onTop = (oy + rad) <= r.y + 2.5 && yOv <= 3.5;
          const onBot = (oy - rad) >= r.y + r.h - 2.5 && yOv <= 3.5;
          if (onTop || onBot) continue;
          // Step up onto a ledge when arriving a little below its lip.
          const feet = pip.y + rad;
          if (feet > r.y && feet <= r.y + STEP_UP && pip.y < r.y + 6 && pip.vy > -80 && r.kind !== "spring") {
            pip.y = r.y - rad;
            if (pip.vy > 0) pip.vy = 0;
            pip.onGround = true;
            pip.onSolid = r;
            continue;
          }
          // Rising fast past a lip: don't snag the corner.
          if (pip.vy < -200 && pip.y <= r.y + rad * 1.8 && r.h > rad * 2) continue;
          if (pip.x < r.x + r.w * 0.5) {
            pip.x = r.x - rad - 0.05;
            applySolidHit(pip, -1, 0, r);
          } else {
            pip.x = r.x + r.w + rad + 0.05;
            applySolidHit(pip, 1, 0, r);
          }
        } else {
          if (pip.vy < -200 && pip.y <= r.y + rad * 1.8 && r.h > rad * 2 &&
              (pip.x < r.x + 4 || pip.x > r.x + r.w - 4)) continue;
          const wasAbove = (oy + rad) <= r.y + 2.2;
          const wasBelow = (oy - rad) >= r.y + r.h - 2.2;
          const preferTop = wasAbove || (!wasBelow && (pip.vy >= 0 && pip.y + rad * 0.25 <= r.y + r.h * 0.5));
          if (preferTop) {
            pip.y = r.y - rad;
            applySolidHit(pip, 0, -1, r);
          } else {
            pip.y = r.y + r.h + rad + 0.05;
            applySolidHit(pip, 0, 1, r);
          }
        }
      }
    }
  }

  function collidePipPlatforms(pip, ox, oy, axis) {
    if (axis) { resolvePlatformAxis(pip, ox, oy, axis); return; }
    resolvePlatformAxis(pip, ox, oy, "x");
    resolvePlatformAxis(pip, pip.x, oy, "y");
    const rad = pip.r;
    for (let i = 0; i < state.solids.length; i++) {
      const r = state.solids[i];
      if (r.gone || r.kind === "spring") continue;
      if (pip.x + rad * 0.45 > r.x && pip.x - rad * 0.45 < r.x + r.w) {
        const feet = pip.y + rad;
        if (feet >= r.y - 1.4 && feet <= r.y + 4 && pip.y <= r.y + 0.5 && pip.vy >= -70) {
          pip.y = r.y - rad;
          if (pip.vy > 0) pip.vy = 0;
          pip.onGround = true;
          pip.onSolid = r;
        }
      }
    }
  }

  function collidePipBands(pip, dt) {
    if (pip.bounceLock > 0) pip.bounceLock -= dt;
    for (let b = 0; b < state.bands.length; b++) {
      const band = state.bands[b];
      if (!band.alive) continue;
      const nodes = band.nodes;
      for (let i = 1; i < nodes.length; i++) {
        const A = nodes[i - 1], B = nodes[i];
        const p = closestPoint(A, B, pip.x, pip.y);
        const endSkip = (pip.vy > 100) ? 3 : 8;
        if (A.pinned && dist(p.x, p.y, A.x, A.y) < endSkip) continue;
        if (B.pinned && dist(p.x, p.y, B.x, B.y) < endSkip) continue;
        const dx = pip.x - p.x, dy = pip.y - p.y;
        const d = Math.hypot(dx, dy);
        const rad = pip.r + BAND_HALF;
        if (d >= rad || d === 0) continue;
        const nx = dx / d, ny = dy / d;
        const pen = rad - d;
        pip.x += nx * pen * 0.95;
        pip.y += ny * pen * 0.95;
        const incoming = Math.max(0, -(pip.vx * nx + pip.vy * ny));
        const wA = A.pinned ? 0 : (1 - p.t);
        const wB = B.pinned ? 0 : p.t;
        const load = 20 + incoming * 0.07;
        if (wA) { A.x -= nx * load * wA * 0.05; A.y -= ny * load * wA * 0.05; }
        if (wB) { B.x -= nx * load * wB * 0.05; B.y -= ny * load * wB * 0.05; }
        if (ny < -0.18) {
          pip.onBand = band;
          if (!A.pinned) A.y += 0.55;
          if (!B.pinned) B.y += 0.55;
          const strain = bandStrain(band);
          if (strain >= RED_AT) { snapBand(band); return; }
          const tness = clamp((strain - 0.88) / 0.52, 0, 1);
          const trampoline = strain >= YELLOW_AT && incoming > 200;
          if (incoming > 55 && trampoline && pip.bounceLock <= 0) {
            const resti = 0.42 + tness * 0.78;
            const vn = pip.vx * nx + pip.vy * ny;
            pip.vx -= vn * nx * (1 + resti);
            pip.vy -= vn * ny * (1 + resti);
            const pop = 40 + tness * 220;
            pip.vx += nx * pop * 0.25 + pip.facing * (10 + tness * 28);
            pip.vy += ny * pop;
            pip.onGround = false;
            pip.squash = 1.12 + tness * 0.22;
            pip.bounceLock = 0.1 + tness * 0.1;
            sfx.boing(strain);
          } else {
            pip.onGround = true;
            if (pip.vy > 0) pip.vy = 0;
          }
        } else {
          const vn = pip.vx * nx + pip.vy * ny;
          if (vn < 0) { pip.vx -= vn * nx; pip.vy -= vn * ny; }
        }
      }
    }
  }

  function collideSpikes(pip) {
    const sp = currentLevel().spikes;
    for (let i = 0; i < sp.length; i++) {
      const s = sp[i];
      if (pip.x + pip.r * 0.5 > s.x && pip.x - pip.r * 0.5 < s.x + s.w &&
          pip.y + pip.r > s.y + 4 && pip.y - pip.r * 0.2 < s.y + s.h) return true;
    }
    return false;
  }

  function goalSolid() {
    for (let i = 0; i < state.solids.length; i++) if (state.solids[i].goal) return state.solids[i];
    return null;
  }

  function reachedGoal(pip) {
    if (!pip.onGround) return false;
    const r = goalSolid();
    if (!r || r.gone) return false;
    return pip.x + pip.r * 0.25 >= r.x && pip.x - pip.r * 0.25 <= r.x + r.w &&
      Math.abs(pip.y + pip.r - r.y) < 8;
  }

  function starCount(used, par) {
    if (used <= par) return 3;
    if (used <= par + 1) return 2;
    return 1;
  }

  function maxPenetration() {
    const pip = state.pip;
    if (!pip) return 0;
    let maxp = 0;
    for (let i = 0; i < state.solids.length; i++) {
      const r = state.solids[i];
      if (r.gone) continue;
      const cx = clamp(pip.x, r.x, r.x + r.w);
      const cy = clamp(pip.y, r.y, r.y + r.h);
      if (cx === pip.x && cy === pip.y) {
        const d = Math.min(pip.x - r.x, r.x + r.w - pip.x, pip.y - r.y, r.y + r.h - pip.y);
        maxp = Math.max(maxp, pip.r + d);
      } else {
        maxp = Math.max(maxp, pip.r - Math.hypot(pip.x - cx, pip.y - cy));
      }
    }
    return maxp;
  }

  function stepCrumble(pip, dt) {
    for (let i = 0; i < state.solids.length; i++) {
      const r = state.solids[i];
      if (r.pressT) r.pressT = Math.max(0, r.pressT - dt);
      if (r.kind !== "crumble" || r.gone) continue;
      if (r.crumbleT > 0 || (pip.onGround && pip.onSolid === r)) {
        r.crumbleT += dt;
        if (r.crumbleT >= CRUMBLE_TIME) {
          r.gone = true;
          sfx.crumble();
          burst(r.x + r.w / 2, r.y + r.h / 2, "#a0703a", 18);
          if (pip.onSolid === r) { pip.onGround = false; pip.onSolid = null; }
        }
      }
    }
  }

  function stepPip(dt) {
    const pip = state.pip;
    if (!pip || !pip.alive || state.mode !== "run") return;
    state.runTime += dt;
    pip.vy += GRAVITY * dt;
    if (pip.onGround) {
      pip.vx += WALK_ACCEL * dt * pip.facing;
      pip.vx = clamp(pip.vx, -WALK_SPEED, WALK_SPEED);
      if (Math.abs(pip.vx) > 20) { pip.walkPhase += dt * 8; sfx.foot(time); }
      pip.vx *= (1 - GROUND_FRICTION * dt * 0.15);
    } else {
      pip.vx += WALK_ACCEL * 0.06 * dt * pip.facing;
      pip.vx *= (1 - AIR_DRAG * dt);
    }
    pip.squash = lerp(pip.squash, 1, 1 - Math.pow(0.001, dt));
    const travel = Math.hypot(pip.vx, pip.vy) * dt;
    const steps = clamp(Math.ceil(travel / MAX_SUB_PX), 1, 40);
    const sdt = dt / steps;
    pip.onGround = false;
    pip.onBand = null;
    pip.onSolid = null;
    for (let s = 0; s < steps; s++) {
      const ox = pip.x, oy = pip.y;
      pip.x += pip.vx * sdt;
      collidePipPlatforms(pip, ox, oy, "x");
      const ix = pip.x;
      pip.y += pip.vy * sdt;
      collidePipPlatforms(pip, ix, oy, "y");
      collidePipBands(pip, sdt);
      collidePipPlatforms(pip, pip.x, pip.y);
      if (!pip.alive || state.mode !== "run") return;
    }
    const pen = maxPenetration();
    if (pen > state.maxPen) state.maxPen = pen;
    stepCrumble(pip, dt);
    let clamped = false;
    if (pip.x < pip.r - 8) { pip.x = pip.r - 8; if (pip.vx < 0) pip.vx = 0; clamped = true; }
    if (pip.x > W - pip.r + 8) { pip.x = W - pip.r + 8; if (pip.vx > 0) pip.vx = 0; clamped = true; }
    if (clamped) collidePipPlatforms(pip, pip.x, pip.y);
    if (pip.y > H + 40 || collideSpikes(pip)) { failRun("fall"); return; }
    if (reachedGoal(pip)) { winRun(); return; }
    // Stuck detection: no real progress for a while (e.g. a slack hammock).
    if (dist(pip.x, pip.y, state.stuckX, state.stuckY) > 6) {
      state.stuckX = pip.x; state.stuckY = pip.y; state.stuckT = 0;
    } else {
      state.stuckT += dt;
      if (state.stuckT > STUCK_TIME) { failRun("stuck"); return; }
    }
    if (state.runTime > RUN_TIMEOUT) failRun("timeout");
  }

  function failRun(reason) {
    if (state.mode !== "run") return;
    state.mode = "fail";
    state.failReason = reason || "fall";
    state.pip.alive = false;
    state.failTimer = reason === "stuck" ? 1.4 : 1.15;
    sfx.fail();
    burst(state.pip.x, state.pip.y, "#e07a5f", 16);
    addFloater(state.pip.x, state.pip.y - 24, reason === "stuck" ? "Pip is stuck!" : reason === "timeout" ? "Too slow!" : "Oh no!");
    hooks.onFail(state.failReason);
  }

  function winRun() {
    if (state.mode !== "run") return;
    state.mode = "win";
    state.pip.vx *= 0.3;
    sfx.win();
    addFloater(currentLevel().goal.x, currentLevel().goal.y - 50, "Home!");
    hooks.onWin(state.goUsed);
  }

  function go() {
    if (state.mode !== "build") return false;
    state.ghosts = state.bands.map(function (b) { return { i: b.i, j: b.j }; });
    state.goUsed = state.bands.length;
    // Rebuild and pre-settle every band so a run never depends on how long
    // the player spent thinking: the same layout always plays out the same.
    state.bands = state.ghosts.map(function (g) { return makeBand(g.i, g.j, state.level); });
    for (let k = 0; k < 90; k++) {
      for (let b = 0; b < state.bands.length; b++) stepBand(state.bands[b], DT);
    }
    state.mode = "run";
    resetPip();
    state.pip.onGround = true;
    state.stuckX = state.pip.x; state.stuckY = state.pip.y; state.stuckT = 0;
    state.runTime = 0;
    sfx.click();
    return true;
  }

  function restartKeepLayout() {
    const ghosts = state.ghosts.length ? state.ghosts.slice() :
      state.bands.map(function (b) { return { i: b.i, j: b.j }; });
    loadLevelData(state.level, true, state.extraBands);
    state.ghosts = ghosts;
    ghosts.forEach(function (g) {
      if (canPlace(g.i, g.j, state.level) === true) state.bands.push(makeBand(g.i, g.j, state.level));
    });
  }

  function stepWorld(dt) {
    time += dt;
    if (state.shake) state.shake = Math.max(0, state.shake - dt * 40);
    const list = state.bands.slice();
    for (let i = 0; i < list.length; i++) if (list[i].alive) stepBand(list[i], dt);
    if (state.mode === "run") stepPip(dt);
    else if (state.mode === "win") {
      const pip = state.pip;
      if (pip) { pip.vy = 0; pip.vx *= 0.9; pip.walkPhase += dt * 3; pip.squash = 1 + Math.sin(time * 8) * 0.05; }
    } else if (state.mode === "fail") {
      state.failTimer -= dt;
      if (state.pip) { state.pip.vy += GRAVITY * dt * 0.5; state.pip.y += state.pip.vy * dt; }
      if (state.failTimer <= 0) hooks.onFailDone();
    }
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) state.particles.splice(i, 1);
    }
    for (let i = state.floaters.length - 1; i >= 0; i--) {
      const f = state.floaters[i];
      f.y += f.vy * dt; f.life -= dt * 0.8;
      if (f.life <= 0) state.floaters.splice(i, 1);
    }
    for (let i = state.snaps.length - 1; i >= 0; i--) {
      state.snaps[i].life -= dt;
      if (state.snaps[i].life <= 0) state.snaps.splice(i, 1);
    }
  }

  // Headless simulation of one band layout. Returns "win", "fail:<reason>" or "timeout".
  function simulate(level, pairs, extra) {
    const savedHooks = { onWin: hooks.onWin, onFail: hooks.onFail, onFailDone: hooks.onFailDone };
    let result = null;
    hooks.onWin = function () { result = "win"; };
    hooks.onFail = function (r) { result = "fail:" + r; };
    hooks.onFailDone = function () {};
    loadLevelData(level, false, extra || 0);
    for (let k = 0; k < pairs.length; k++) {
      if (canPlace(pairs[k][0], pairs[k][1], level) !== true) { result = "invalid"; break; }
      state.bands.push(makeBand(pairs[k][0], pairs[k][1], level));
    }
    let ticks = 0;
    if (!result) {
      go();
      for (; ticks < 60 * (RUN_TIMEOUT + 1) && !result; ticks++) stepWorld(DT);
    }
    const out = { result: result || "timeout", ticks: ticks, maxPen: state.maxPen, snaps: state.snapCount };
    hooks.onWin = savedHooks.onWin; hooks.onFail = savedHooks.onFail; hooks.onFailDone = savedHooks.onFailDone;
    return out;
  }

  // ===== audio.js: WebAudio sound effects and a gentle generative music loop =====
  const sfx = {
    ctx: null, master: null, musicGain: null,
    stretchOsc: null, stretchGain: null, lastFoot: 0,
    soundOn: true, musicOn: true, musicTimer: null, musicStep: 0, nextNote: 0,
    ensure: function () {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try {
        if (!this.ctx) {
          this.ctx = new AC();
          this.master = this.ctx.createGain();
          this.master.gain.value = 0.9;
          this.master.connect(this.ctx.destination);
          this.musicGain = this.ctx.createGain();
          this.musicGain.gain.value = 0.0;
          this.musicGain.connect(this.ctx.destination);
        }
        if (this.ctx.state === "suspended") this.ctx.resume();
      } catch (e) { return null; }
      this.syncMusic();
      return this.ctx;
    },
    live: function () { return this.soundOn ? this.ensure() : null; },
    beep: function (freq, dur, type, vol, slide, delay) {
      const c = this.live();
      if (!c) return;
      const t0 = c.currentTime + (delay || 0);
      const o = c.createOscillator();
      const g = c.createGain();
      const f = c.createBiquadFilter();
      o.type = type || "triangle";
      o.frequency.setValueAtTime(freq, t0);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
      f.type = "lowpass";
      f.frequency.value = 2000;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.08, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(f); f.connect(g); g.connect(this.master);
      o.start(t0);
      o.stop(t0 + dur + 0.03);
    },
    noise: function (dur, freq, vol, type) {
      const c = this.live();
      if (!c) return;
      const n = Math.max(1, Math.floor(c.sampleRate * dur));
      const buffer = c.createBuffer(1, n, c.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
      const src = c.createBufferSource();
      const f = c.createBiquadFilter();
      const g = c.createGain();
      src.buffer = buffer;
      f.type = type || "bandpass";
      f.frequency.value = freq || 900;
      g.gain.setValueAtTime(vol || 0.2, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      src.connect(f); f.connect(g); g.connect(this.master);
      src.start();
    },
    startStretch: function (strain) {
      const c = this.live();
      if (!c) return;
      this.stopStretch();
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(140 + strain * 260, c.currentTime);
      g.gain.setValueAtTime(0.0001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.04, c.currentTime + 0.06);
      o.connect(g); g.connect(this.master);
      o.start();
      this.stretchOsc = o;
      this.stretchGain = g;
    },
    updateStretch: function (strain) {
      const c = this.ctx;
      if (!this.soundOn) return;
      if (!c || !this.stretchOsc) { this.startStretch(strain); return; }
      this.stretchOsc.frequency.setTargetAtTime(140 + clamp(strain, 0, 2) * 280, c.currentTime, 0.04);
      this.stretchGain.gain.setTargetAtTime(0.025 + clamp(strain - 0.7, 0, 1) * 0.04, c.currentTime, 0.05);
    },
    stopStretch: function (twang) {
      const c = this.ctx;
      if (!c || !this.stretchOsc) return;
      const o = this.stretchOsc, g = this.stretchGain;
      this.stretchOsc = null;
      this.stretchGain = null;
      try {
        if (twang && this.soundOn) {
          o.frequency.exponentialRampToValueAtTime(Math.max(60, o.frequency.value * 0.55), c.currentTime + 0.18);
          g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.2);
          o.stop(c.currentTime + 0.22);
        } else {
          g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.05);
          o.stop(c.currentTime + 0.08);
        }
      } catch (e) { /* already stopped */ }
    },
    snap: function () {
      this.stopStretch(false);
      this.beep(220, 0.18, "sawtooth", 0.05, 70);
      this.beep(90, 0.22, "square", 0.04, 40);
      this.noise(0.18, 900, 0.22);
    },
    hook: function () { this.beep(520, 0.07, "triangle", 0.05); this.beep(780, 0.05, "sine", 0.025, 0, 0.03); },
    deny: function () { this.beep(160, 0.12, "square", 0.03, 120); },
    win: function () {
      this.beep(523, 0.14, "triangle", 0.06);
      this.beep(659, 0.14, "triangle", 0.06, 0, 0.11);
      this.beep(784, 0.14, "triangle", 0.06, 0, 0.22);
      this.beep(1047, 0.35, "triangle", 0.06, 0, 0.33);
    },
    fail: function () { this.beep(220, 0.28, "sine", 0.05, 90); },
    foot: function (t) {
      if (t - this.lastFoot < 0.22) return;
      this.lastFoot = t;
      this.beep(140 + Math.random() * 30, 0.04, "sine", 0.018);
    },
    click: function () { this.beep(660, 0.05, "triangle", 0.03); },
    boing: function (strain) {
      const f = 280 + clamp(strain, 0.8, 1.7) * 220;
      this.beep(f, 0.14, "triangle", 0.05, f * 0.55);
      this.beep(f * 1.5, 0.1, "sine", 0.02, f, 0.02);
    },
    launch: function () { this.beep(300, 0.35, "triangle", 0.05, 1200); },
    spring: function () { this.beep(200, 0.25, "square", 0.03, 900); this.beep(400, 0.2, "triangle", 0.03, 1300, 0.03); },
    crumble: function () { this.noise(0.3, 300, 0.25, "lowpass"); this.beep(110, 0.2, "sawtooth", 0.02, 60); },
    coin: function (k) { this.beep(988, 0.07, "square", 0.025, 0, (k || 0) * 0.06); this.beep(1319, 0.12, "square", 0.025, 0, (k || 0) * 0.06 + 0.06); },
    star: function (k) { this.beep(660 + k * 220, 0.18, "triangle", 0.05, 0, 0); },
    // ---- music: soft pentatonic plucks over a slow bass ----
    syncMusic: function () {
      if (!this.ctx) return;
      const want = this.musicOn ? 0.05 : 0.0;
      this.musicGain.gain.setTargetAtTime(want, this.ctx.currentTime, 0.3);
      if (this.musicOn && !this.musicTimer) {
        this.nextNote = this.ctx.currentTime + 0.1;
        const self = this;
        this.musicTimer = setInterval(function () { self.scheduleMusic(); }, 120);
      } else if (!this.musicOn && this.musicTimer) {
        clearInterval(this.musicTimer);
        this.musicTimer = null;
      }
    },
    scheduleMusic: function () {
      const c = this.ctx;
      if (!c || c.state !== "running") return;
      const scale = [0, 2, 4, 7, 9, 12, 14, 16];
      const chords = [0, 5, 7, 3];
      const beat = 0.32;
      while (this.nextNote < c.currentTime + 0.4) {
        const step = this.musicStep++;
        const bar = Math.floor(step / 8) % chords.length;
        const root = 196 * Math.pow(2, chords[bar] / 12);
        const t = this.nextNote;
        if (step % 8 === 0) this.tone(root / 2, t, beat * 7.5, "sine", 0.6);
        const pattern = [0, 2, 4, 2, 5, 4, 2, 3];
        if ((step * 7) % 3 !== 1) {
          const deg = scale[(pattern[step % 8] + bar) % scale.length];
          this.tone(root * Math.pow(2, deg / 12), t, beat * 1.6, "triangle", 0.35);
        }
        this.nextNote += beat;
      }
    },
    tone: function (freq, t, dur, type, vol) {
      const c = this.ctx;
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.musicGain);
      o.start(t);
      o.stop(t + dur + 0.05);
    },
  };

  // ===== render.js: themes and world drawing (all vector, no assets) =====
  const FONT = "Trebuchet MS, Segoe UI, system-ui, sans-serif";
  const THEMES = [
    { name: "The Workbench", sub: "Bridges and gaps", bgTop: "#f6eedd", bgBot: "#ecdcbf", dot: "rgba(60,44,28,0.07)",
      plat: ["#e2c089", "#c99555", "#b07d42"], edge: "rgba(80,50,20,0.35)", ink: "#3a2714", accent: "#d4892a", outer: "#3b2b1c" },
    { name: "Bounce House", sub: "Trampolines", bgTop: "#ffeef4", bgBot: "#f4dcf0", dot: "rgba(150,60,120,0.07)",
      plat: ["#9fe0d4", "#5cc2b4", "#3c9c90"], edge: "rgba(20,90,80,0.35)", ink: "#4a2240", accent: "#e0679a", outer: "#3d2240" },
    { name: "Snap Yard", sub: "Snap launches", bgTop: "#dfe7f2", bgBot: "#f4d3b0", dot: "rgba(40,50,80,0.07)",
      plat: ["#b8c4d4", "#8c9bb0", "#6d7c92"], edge: "rgba(30,40,60,0.4)", ink: "#26324a", accent: "#e07a3a", outer: "#232c3f" },
    { name: "Sky Works", sub: "Springs and planks", bgTop: "#cbe9ff", bgBot: "#f1f9ff", dot: "rgba(40,90,140,0.06)",
      plat: ["#e9e2d0", "#c8bea5", "#a69a7e"], edge: "rgba(70,60,40,0.35)", ink: "#1f3550", accent: "#3a8fd8", outer: "#1d3047" },
  ];
  let theme = THEMES[0];

  function roundRect(c, x, y, w, h, r) {
    const rr = Math.max(0, Math.min(r, w / 2, h / 2));
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  function themeFor(worldIndex) { return THEMES[clamp(worldIndex | 0, 0, THEMES.length - 1)]; }

  function drawBackdrop(c, th, w, h, t) {
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, th.bgTop);
    g.addColorStop(1, th.bgBot);
    c.fillStyle = g;
    c.fillRect(0, 0, w, h);
    const idx = THEMES.indexOf(th);
    if (idx === 0) {
      c.fillStyle = th.dot;
      for (let y = 16; y < h; y += 22) for (let x = 16; x < w; x += 22) c.fillRect(x, y, 1.6, 1.6);
      c.strokeStyle = "rgba(120,80,40,0.06)";
      c.lineWidth = 1;
      for (let x = 0; x < w; x += 88) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); }
    } else if (idx === 1) {
      c.save();
      c.globalAlpha = 0.25;
      c.fillStyle = "#ffffff";
      for (let x = -h; x < w; x += 46) {
        c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 22, 0); c.lineTo(x + 22 + h, h); c.lineTo(x + h, h); c.closePath(); c.fill();
      }
      c.restore();
      // bunting
      const cols = ["#e0679a", "#5cc2b4", "#f0c03a", "#8a7bd8"];
      for (let i = 0; i * 34 < w + 34; i++) {
        c.fillStyle = cols[i % cols.length];
        const x = i * 34;
        c.beginPath(); c.moveTo(x, 64); c.lineTo(x + 30, 64); c.lineTo(x + 15, 84); c.closePath(); c.fill();
      }
      c.strokeStyle = "rgba(80,40,70,0.3)"; c.beginPath(); c.moveTo(0, 64); c.lineTo(w, 64); c.stroke();
    } else if (idx === 2) {
      c.fillStyle = "rgba(255,230,190,0.55)";
      c.beginPath(); c.arc(w * 0.78, h * 0.3, 46, 0, Math.PI * 2); c.fill();
      c.fillStyle = "rgba(60,70,100,0.10)";
      for (let i = 0; i < 9; i++) {
        const bw = 40 + (i * 37) % 50, bh = 80 + (i * 53) % 140;
        c.fillRect((i * 61) % w, h - bh - 60, bw, bh + 60);
      }
    } else {
      c.fillStyle = "rgba(255,255,255,0.75)";
      for (let i = 0; i < 6; i++) {
        const cx = ((i * 97 + t * 6 * (1 + (i % 3))) % (w + 160)) - 80, cy = 110 + (i * 83) % 420;
        c.beginPath();
        c.ellipse(cx, cy, 46, 14, 0, 0, Math.PI * 2);
        c.ellipse(cx + 24, cy - 8, 28, 14, 0, 0, Math.PI * 2);
        c.ellipse(cx - 22, cy - 4, 24, 11, 0, 0, Math.PI * 2);
        c.fill();
      }
    }
  }

  function drawSolid(c, r, th) {
    if (r.gone) return;
    if (r.kind === "spring") { drawSpring(c, r, th); return; }
    if (r.kind === "crumble") { drawCrumble(c, r); return; }
    c.save();
    roundRect(c, r.x, r.y, r.w, r.h, 6);
    const g = c.createLinearGradient(r.x, r.y, r.x, r.y + Math.min(r.h, 40));
    g.addColorStop(0, th.plat[0]);
    g.addColorStop(0.4, th.plat[1]);
    g.addColorStop(1, th.plat[2]);
    c.fillStyle = g;
    c.fill();
    c.strokeStyle = th.edge;
    c.lineWidth = 1.2;
    c.stroke();
    c.beginPath();
    c.strokeStyle = "rgba(255,255,255,0.35)";
    c.lineWidth = 2;
    c.moveTo(r.x + 6, r.y + 3);
    c.lineTo(r.x + r.w - 6, r.y + 3);
    c.stroke();
    const idx = THEMES.indexOf(th);
    c.save();
    roundRect(c, r.x, r.y, r.w, r.h, 6);
    c.clip();
    if (idx === 0) {
      c.strokeStyle = "rgba(90,50,20,0.10)";
      c.lineWidth = 1;
      for (let y = r.y + 10; y < r.y + r.h - 4; y += 11) {
        c.beginPath();
        c.moveTo(r.x + 4, y);
        c.bezierCurveTo(r.x + r.w * 0.3, y + 2, r.x + r.w * 0.7, y - 2, r.x + r.w - 4, y);
        c.stroke();
      }
    } else if (idx === 1) {
      c.fillStyle = "rgba(255,255,255,0.22)";
      for (let x = r.x - r.h; x < r.x + r.w; x += 18) {
        c.beginPath(); c.moveTo(x, r.y + r.h); c.lineTo(x + 8, r.y + r.h); c.lineTo(x + 8 + r.h, r.y); c.lineTo(x + r.h, r.y); c.closePath(); c.fill();
      }
    } else if (idx === 2) {
      c.fillStyle = "rgba(30,40,60,0.35)";
      for (let y = r.y + 10; y < r.y + r.h; y += 26) {
        c.beginPath(); c.arc(r.x + 6, y, 1.8, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(r.x + r.w - 6, y, 1.8, 0, Math.PI * 2); c.fill();
      }
      c.strokeStyle = "rgba(30,40,60,0.12)";
      for (let y = r.y + 26; y < r.y + r.h; y += 26) { c.beginPath(); c.moveTo(r.x, y); c.lineTo(r.x + r.w, y); c.stroke(); }
    } else {
      c.strokeStyle = "rgba(80,70,50,0.14)";
      for (let y = r.y + 14; y < r.y + r.h; y += 14) {
        const off = ((y / 14) | 0) % 2 ? 0 : 14;
        c.beginPath(); c.moveTo(r.x, y); c.lineTo(r.x + r.w, y); c.stroke();
        for (let x = r.x + off; x < r.x + r.w; x += 28) { c.beginPath(); c.moveTo(x, y - 14); c.lineTo(x, y); c.stroke(); }
      }
    }
    c.restore();
    c.restore();
  }

  function drawSpring(c, r) {
    c.save();
    const press = r.pressT ? Math.sin(r.pressT / 0.25 * Math.PI) * 6 : 0;
    roundRect(c, r.x + 2, r.y + 12, r.w - 4, r.h - 12, 4);
    c.fillStyle = "#6d7c92"; c.fill();
    c.strokeStyle = "rgba(20,30,40,0.4)"; c.stroke();
    c.strokeStyle = "#c9cdd4";
    c.lineWidth = 2.4;
    c.beginPath();
    const top = r.y + 4 + press, bot = r.y + 16;
    for (let i = 0; i <= 6; i++) {
      const y = lerp(top + 4, bot, i / 6);
      const x = r.x + (i % 2 ? r.w - 8 : 8);
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.stroke();
    roundRect(c, r.x - 2, top - 4, r.w + 4, 8, 4);
    c.fillStyle = "#e24b4b"; c.fill();
    c.strokeStyle = "rgba(120,20,20,0.5)"; c.lineWidth = 1; c.stroke();
    c.restore();
  }

  function drawCrumble(c, r) {
    c.save();
    let sx = 0;
    if (r.crumbleT > 0) sx = Math.sin(time * 70) * 2 * (r.crumbleT / CRUMBLE_TIME + 0.3);
    c.translate(sx, r.crumbleT > 0 ? r.crumbleT * 6 : 0);
    roundRect(c, r.x, r.y, r.w, r.h, 4);
    c.fillStyle = "#b8874e"; c.fill();
    c.strokeStyle = "rgba(80,40,10,0.5)"; c.lineWidth = 1.2; c.stroke();
    c.strokeStyle = "rgba(60,30,10,0.55)";
    c.lineWidth = 1.3;
    for (let x = r.x + 18; x < r.x + r.w - 6; x += 26) {
      c.beginPath();
      c.moveTo(x, r.y + 1); c.lineTo(x + 4, r.y + 6); c.lineTo(x - 2, r.y + 10); c.lineTo(x + 3, r.y + r.h - 1);
      c.stroke();
    }
    c.fillStyle = "rgba(255,240,210,0.35)";
    c.fillRect(r.x + 3, r.y + 2, r.w - 6, 2);
    c.restore();
  }

  function drawSpikes(c, s) {
    const n = Math.max(2, Math.round(s.w / 16));
    const w = s.w / n;
    c.save();
    c.fillStyle = "#8a8f99";
    c.strokeStyle = "rgba(40,40,50,0.45)";
    c.lineWidth = 1;
    c.beginPath();
    for (let i = 0; i < n; i++) {
      const x = s.x + i * w;
      if (s.down) { c.moveTo(x, s.y); c.lineTo(x + w * 0.5, s.y + s.h); c.lineTo(x + w, s.y); }
      else { c.moveTo(x, s.y + s.h); c.lineTo(x + w * 0.5, s.y); c.lineTo(x + w, s.y + s.h); }
    }
    c.closePath();
    c.fill();
    c.stroke();
    c.fillStyle = "#d3d7de";
    c.beginPath();
    for (let i = 0; i < n; i++) {
      const x = s.x + i * w;
      if (s.down) { c.moveTo(x + w * 0.5, s.y + s.h); c.lineTo(x + w * 0.62, s.y + s.h * 0.45); c.lineTo(x + w * 0.5, s.y + s.h * 0.45); }
      else { c.moveTo(x + w * 0.5, s.y); c.lineTo(x + w * 0.62, s.y + s.h * 0.55); c.lineTo(x + w * 0.5, s.y + s.h * 0.55); }
    }
    c.fill();
    if (s.down) { c.fillStyle = "#6d7c92"; c.fillRect(s.x, s.y - 6, s.w, 6); }
    c.restore();
  }

  function drawPeg(c, peg, glow, hintGlow) {
    c.save();
    c.translate(peg.x, peg.y);
    c.fillStyle = "rgba(40,25,10,0.22)";
    c.beginPath(); c.ellipse(1.5, 4, 8, 3.5, 0, 0, Math.PI * 2); c.fill();
    if (hintGlow) {
      const p = 0.5 + 0.5 * Math.sin(time * 6);
      c.fillStyle = "rgba(255,215,64," + (0.25 + p * 0.35) + ")";
      c.beginPath(); c.arc(0, 0, 18 + p * 5, 0, Math.PI * 2); c.fill();
    } else if (glow) {
      c.fillStyle = "rgba(220,160,50,0.3)";
      c.beginPath(); c.arc(0, 0, 18, 0, Math.PI * 2); c.fill();
    }
    const g = c.createRadialGradient(-2, -3, 1, 0, 0, 11);
    g.addColorStop(0, "#f0d37a");
    g.addColorStop(0.45, "#c9a227");
    g.addColorStop(1, "#7a5a12");
    c.fillStyle = g;
    c.beginPath(); c.arc(0, 0, 10, 0, Math.PI * 2); c.fill();
    c.strokeStyle = "rgba(80,50,10,0.55)"; c.lineWidth = 1.2; c.stroke();
    c.beginPath(); c.arc(0, 0, 3.2, 0, Math.PI * 2); c.fillStyle = "#3a2a10"; c.fill();
    c.beginPath(); c.arc(-2.5, -3, 2, 0, Math.PI * 2); c.fillStyle = "rgba(255,255,230,0.55)"; c.fill();
    c.restore();
  }

  function drawBandPoly(c, nodes, color, width, shiver) {
    c.save();
    c.lineCap = "round";
    c.lineJoin = "round";
    c.strokeStyle = "rgba(40,20,10,0.18)";
    c.lineWidth = width + 3;
    c.beginPath();
    c.moveTo(nodes[0].x, nodes[0].y + 2);
    for (let i = 1; i < nodes.length; i++) c.lineTo(nodes[i].x, nodes[i].y + 2);
    c.stroke();
    const ox2 = shiver ? Math.sin(time * 50) * 1.2 : 0;
    c.strokeStyle = color;
    c.lineWidth = width;
    c.beginPath();
    c.moveTo(nodes[0].x + ox2, nodes[0].y);
    for (let i = 1; i < nodes.length; i++) c.lineTo(nodes[i].x + ox2, nodes[i].y);
    c.stroke();
    c.strokeStyle = "rgba(255,255,255,0.3)";
    c.lineWidth = Math.max(1.2, width * 0.28);
    c.beginPath();
    c.moveTo(nodes[0].x + ox2, nodes[0].y - 2);
    for (let i = 1; i < nodes.length; i++) c.lineTo(nodes[i].x + ox2, nodes[i].y - 2);
    c.stroke();
    c.restore();
  }

  function strainColor(strain, alpha) {
    const a = alpha == null ? 1 : alpha;
    let r, g, b;
    if (strain <= 1.02) { r = 86; g = 168; b = 92; }
    else if (strain < YELLOW_AT) { const t = (strain - 1.02) / (YELLOW_AT - 1.02); r = lerp(86, 230, t); g = lerp(168, 186, t); b = lerp(92, 58, t); }
    else if (strain < RED_AT) { const t = (strain - YELLOW_AT) / (RED_AT - YELLOW_AT); r = lerp(230, 214, t); g = lerp(186, 74, t); b = lerp(58, 52, t); }
    else { const t = clamp((strain - RED_AT) / (SNAP_RATIO - RED_AT), 0, 1); r = lerp(214, 176, t); g = lerp(74, 28, t); b = lerp(52, 36, t); }
    return "rgba(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + "," + a + ")";
  }

  function previewNodes(x1, y1, x2, y2) {
    const d = dist(x1, y1, x2, y2);
    const slack = Math.max(0, NATURAL - d);
    const sag = slack * 0.45 + (d > NATURAL ? 4 : 10);
    const nodes = [];
    for (let s = 0; s <= 10; s++) {
      const t = s / 10;
      nodes.push({ x: lerp(x1, x2, t), y: lerp(y1, y2, t) + Math.sin(t * Math.PI) * sag * (d > NATURAL ? 0.15 : 1) });
    }
    return nodes;
  }

  function drawFlag(c, g) {
    const x = g.x, y = g.y;
    c.save();
    c.strokeStyle = "#5c3d1e"; c.lineWidth = 3; c.lineCap = "round";
    c.beginPath(); c.moveTo(x, y); c.lineTo(x, y - 54); c.stroke();
    const wave = Math.sin(time * 3) * 3;
    c.beginPath();
    c.moveTo(x, y - 52);
    c.quadraticCurveTo(x + 18, y - 46 + wave, x + 34, y - 44 + wave);
    c.lineTo(x + 30, y - 28 + wave);
    c.quadraticCurveTo(x + 16, y - 32, x, y - 34);
    c.closePath();
    c.fillStyle = "#e24b4b"; c.fill();
    c.strokeStyle = "rgba(120,20,20,0.35)"; c.lineWidth = 1; c.stroke();
    c.beginPath(); c.arc(x, y - 54, 2.4, 0, Math.PI * 2); c.fillStyle = "#c9a227"; c.fill();
    c.restore();
  }

  function drawPip(c, pip, mode) {
    if (!pip) return;
    c.save();
    c.translate(pip.x, pip.y);
    const sq = pip.squash || 1;
    c.scale(2 - sq, sq);
    c.fillStyle = "rgba(40,25,10,0.2)";
    c.beginPath(); c.ellipse(0, pip.r + 1, 11, 3.5, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#3d6e8c";
    roundRect(c, -15, -4, 8, 12, 2); c.fill();
    const body = c.createRadialGradient(-4, -6, 3, 0, 0, 16);
    body.addColorStop(0, "#ffe0b0");
    body.addColorStop(1, "#e7a25a");
    c.fillStyle = body;
    c.beginPath(); c.arc(0, 0, pip.r - 1, 0, Math.PI * 2); c.fill();
    c.strokeStyle = "rgba(120,70,30,0.35)"; c.lineWidth = 1.2; c.stroke();
    // little hat
    c.fillStyle = "#e24b4b";
    c.beginPath(); c.ellipse(1, -12, 9, 4, -0.1, Math.PI, 0); c.fill();
    c.fillRect(-8, -13, 18, 2.5);
    c.fillStyle = "rgba(230,110,90,0.3)";
    c.beginPath(); c.ellipse(-7, 3, 3, 1.8, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(7, 3, 3, 1.8, 0, 0, Math.PI * 2); c.fill();
    const look = (pip.facing || 1) * 1.4;
    const blink = (Math.sin(time * 1.3 + 1) > 0.985) ? 0.3 : 1;
    c.fillStyle = "#2a1c12";
    c.beginPath(); c.ellipse(-4 + look, -3, 2.1, 2.6 * blink, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(5 + look, -3, 2.1, 2.6 * blink, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#fff";
    c.beginPath(); c.arc(-3.4 + look, -4, 0.8, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(5.6 + look, -4, 0.8, 0, Math.PI * 2); c.fill();
    c.strokeStyle = "#7a4a28"; c.lineWidth = 1.2;
    c.beginPath();
    if (pip.alive === false) { c.arc(0.5 + look, 7, 3.5, Math.PI + 0.3, -0.3); }
    else c.arc(0.5 + look, 3, 4, 0.15, Math.PI - 0.15);
    c.stroke();
    if (mode === "run" && pip.onGround) {
      const ph = pip.walkPhase;
      c.strokeStyle = "#c9843c"; c.lineWidth = 2.2; c.lineCap = "round";
      c.beginPath();
      c.moveTo(-3, 12); c.lineTo(-3 + Math.sin(ph) * 5, 16);
      c.moveTo(4, 12); c.lineTo(4 + Math.sin(ph + Math.PI) * 5, 16);
      c.stroke();
    }
    if (pip.onBand && bandStrain(pip.onBand) > RED_AT * 0.95) {
      c.strokeStyle = "#2a1c12"; c.lineWidth = 1.3;
      c.beginPath(); c.moveTo(-7, -8); c.lineTo(-2, -6); c.moveTo(8, -8); c.lineTo(3, -6); c.stroke();
    }
    c.restore();
  }

  function drawStar(c, x, y, size, on) {
    c.save();
    c.translate(x, y);
    c.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
      const b = a + Math.PI / 5;
      if (i === 0) c.moveTo(Math.cos(a) * size, Math.sin(a) * size);
      else c.lineTo(Math.cos(a) * size, Math.sin(a) * size);
      c.lineTo(Math.cos(b) * size * 0.42, Math.sin(b) * size * 0.42);
    }
    c.closePath();
    c.fillStyle = on ? "#f0c03a" : "rgba(80,60,30,0.18)";
    c.fill();
    if (on) { c.strokeStyle = "rgba(140,90,10,0.5)"; c.lineWidth = 1; c.stroke(); }
    c.restore();
  }

  function drawCoin(c, x, y, r) {
    c.save();
    const g = c.createRadialGradient(x - r * 0.3, y - r * 0.3, 1, x, y, r);
    g.addColorStop(0, "#fff1a8");
    g.addColorStop(0.5, "#f2c230");
    g.addColorStop(1, "#b9860c");
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    c.strokeStyle = "rgba(120,80,0,0.6)"; c.lineWidth = 1; c.stroke();
    c.strokeStyle = "rgba(140,95,0,0.7)"; c.lineWidth = Math.max(1, r * 0.18);
    c.beginPath(); c.arc(x, y, r * 0.55, 0.6, Math.PI * 2 - 0.6); c.stroke();
    c.restore();
  }

  function drawComfortCircle(c, peg, taut) {
    c.save();
    c.setLineDash([5, 6]);
    c.strokeStyle = taut ? "rgba(200,70,40,0.35)" : "rgba(70,120,60,0.3)";
    c.lineWidth = 1.4;
    c.beginPath(); c.arc(peg.x, peg.y, NATURAL, 0, Math.PI * 2); c.stroke();
    c.setLineDash([]);
    c.restore();
  }

  // Draw a level scene (terrain, bands, Pip, effects). Used by play and previews.
  function drawScene(c, L, opts) {
    opts = opts || {};
    const th = theme;
    const solids = opts.solids || L.platforms;
    for (let i = 0; i < L.spikes.length; i++) drawSpikes(c, L.spikes[i]);
    for (let i = 0; i < solids.length; i++) drawSolid(c, solids[i], th);
    drawFlag(c, L.goal);
  }

  // ===== economy.js: save data, coins, rewards, ads + IAP stubs =====
  const SAVE_KEY = "rbb3.save";
  const START_COINS = 100;
  const PRICES = { hint: 25, extra: 40, solution: 75 };
  const REWARD = { firstClear: 20, perStar: 5, ad: 30 };
  const AD_DAILY_CAP = 5;
  const MAX_EXTRA = 2;
  const FAILS_PER_FREE_HINT = 3;
  const PACKS = [
    { sku: "rbb.coins.500", coins: 500, name: "Pouch of coins", price: "$0.99" },
    { sku: "rbb.coins.1500", coins: 1500, name: "Sack of coins", price: "$2.99" },
    { sku: "rbb.coins.4000", coins: 4000, name: "Chest of coins", price: "$5.99" },
  ];
  const TEST_MODE = /[?&]testmode=1\b/.test(String(location.search || ""));

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function freshSave() {
    return {
      v: 3, coins: START_COINS, levels: {}, hints: {}, fails: {}, freeUsed: {},
      sound: true, music: true, ads: { day: todayKey(), count: 0 }, seenHelp: false,
      claimed: {}, totalEarned: 0, totalSpent: 0,
    };
  }

  let save = freshSave();
  let storageOk = true;

  function loadSave() {
    try {
      const raw = window.localStorage.getItem(SAVE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && s.v === 3) {
          const base = freshSave();
          for (const k in base) if (s[k] === undefined) s[k] = base[k];
          s.coins = Math.max(0, Math.floor(Number(s.coins) || 0));
          save = s;
        }
      }
    } catch (e) { storageOk = false; save = freshSave(); }
    if (save.ads.day !== todayKey()) save.ads = { day: todayKey(), count: 0 };
    sfx.soundOn = !!save.sound;
    sfx.musicOn = !!save.music;
  }

  function persist() {
    try { window.localStorage.setItem(SAVE_KEY, JSON.stringify(save)); storageOk = true; }
    catch (e) { storageOk = false; }
  }

  function addCoins(n, why) {
    n = Math.max(0, Math.floor(n));
    if (!n) return 0;
    save.coins += n;
    save.totalEarned += n;
    persist();
    return n;
  }

  // Returns true when paid. Never lets the balance go negative.
  function spendCoins(n) {
    n = Math.max(0, Math.floor(n));
    if (save.coins < n) return false;
    save.coins -= n;
    save.totalSpent += n;
    persist();
    return true;
  }

  function levelRec(id) { return save.levels[id] || null; }

  // Records a clear and returns the coins it pays.
  // First clear: 20 + 5 per star. Replays: 5 per newly earned star only.
  function recordClear(id, stars) {
    const rec = save.levels[id] || { stars: 0, cleared: false };
    let pay = 0;
    if (!rec.cleared) pay = REWARD.firstClear + REWARD.perStar * stars;
    else if (stars > rec.stars) pay = REWARD.perStar * (stars - rec.stars);
    rec.cleared = true;
    rec.stars = Math.max(rec.stars || 0, stars);
    save.levels[id] = rec;
    save.fails[id] = 0;
    persist();
    if (pay) addCoins(pay, "clear");
    return pay;
  }

  function adsLeftToday() {
    if (save.ads.day !== todayKey()) { save.ads = { day: todayKey(), count: 0 }; persist(); }
    return Math.max(0, AD_DAILY_CAP - save.ads.count);
  }

  // ---- Rewarded ad stub. A real app build replaces window.RBB_Ads. ----
  if (!window.RBB_Ads) {
    window.RBB_Ads = {
      stub: true,

        wrap.id = "rbb-ad";

          "display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:" + FONT + ";text-align:center;padding:24px;");
        wrap.innerHTML =
          '<div style="font-size:13px;letter-spacing:2px;opacity:.7">SAMPLE AD</div>' +
          '<div style="margin:14px 0 6px;font-size:24px;font-weight:bold">This is a placeholder ad</div>' +
          '<div style="max-width:300px;font-size:14px;opacity:.8;line-height:1.4">No ad network is connected in the web version. ' +
          'In the app this slot would show a real rewarded video.</div>' +
          '<div id="rbb-ad-count" style="margin:22px 0;font-size:42px;font-weight:bold">' + AD_SECONDS + '</div>' +
          '<button id="rbb-ad-close" style="font:inherit;font-size:15px;padding:10px 18px;border-radius:10px;border:0;background:#556;color:#ccd">Close (no reward)</button>';
        document.body.appendChild(wrap);
        let left = AD_SECONDS, done = false;
        const countEl = wrap.querySelector("#rbb-ad-count");
        const btn = wrap.querySelector("#rbb-ad-close");
        function finish(rewarded) {
          if (done) return;
          done = true;
          clearInterval(timer);
          if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
          cb({ rewarded: rewarded });
        }
        const timer = setInterval(function () {
          left -= 1;
          if (left > 0) { countEl.textContent = String(left); return; }
          clearInterval(timer);
          countEl.textContent = "Done!";
          btn.textContent = "Collect reward";
          btn.style.background = "#f0c03a";
          btn.style.color = "#3a2714";
          btn.dataset.ready = "1";
        }, 1000);
        btn.addEventListener("click", function () { finish(btn.dataset.ready === "1"); });
      },
    };
  }

  // ---- In-app purchase stub. The web build never charges anything. ----
  if (!window.RBB_IAP) {
    window.RBB_IAP = {
      stub: true,
      available: false,
      purchase: function (sku, cb) {
        setTimeout(function () {
          if (TEST_MODE) cb({ ok: true, test: true, sku: sku, token: "test-" + sku + "-" + Date.now() + "-" + Math.random().toString(36).slice(2) });
          else cb({ ok: false, reason: "web", sku: sku });
        }, 60);
      },
    };
  }

  let adBusy = false;
  function watchAd(done) {
    if (adBusy) return;
    if (adsLeftToday() <= 0) { done({ ok: false, reason: "cap" }); return; }
    adBusy = true;
    const token = "ad-" + Date.now() + "-" + Math.random().toString(36).slice(2);
    let used = false;
    window.RBB_Ads.showRewarded(function (res) {
      if (used) return; // ignore a second callback from the provider
      used = true;
      adBusy = false;
