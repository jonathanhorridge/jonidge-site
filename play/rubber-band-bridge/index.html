    const dx = bx - ax, dy = by - ay;

  function strainColor(strain, alpha) {
    const a = alpha == null ? 1 : alpha;

    if (strain <= 1.02) {
      r = 86; g = 168; b = 92;
    } else if (strain < YELLOW_AT) {
      const t = (strain - 1.02) / (YELLOW_AT - 1.02);
      r = lerp(86, 230, t); g = lerp(168, 186, t); b = lerp(92, 58, t);
    } else if (strain < RED_AT) {
      const t = (strain - YELLOW_AT) / (RED_AT - YELLOW_AT);
      r = lerp(230, 214, t); g = lerp(186, 74, t); b = lerp(58, 52, t);
    } else {
      const t = clamp((strain - RED_AT) / (SNAP_RATIO - RED_AT), 0, 1);
      r = lerp(214, 176, t); g = lerp(74, 28, t); b = lerp(52, 36, t);
    }
    return "rgba(" + (r|0) + "," + (g|0) + "," + (b|0) + "," + a + ")";
  }

  // ----- Audio -----

    ensure: function () {
      if (state.muted) return null;
      const AC = window.AudioContext || window.webkitAudioContext;

    beep: function (freq, dur, type, vol, slide) {
      const c = this.ensure();
      if (!c) return;
      const o = c.createOscillator();
      const g = c.createGain();
      const f = c.createBiquadFilter();
      o.type = type || "triangle";
      o.frequency.setValueAtTime(freq, c.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), c.currentTime + dur);
      f.type = "lowpass";
      f.frequency.value = 1800;
      g.gain.setValueAtTime(vol || 0.08, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      o.connect(f); f.connect(g); g.connect(c.destination);
      o.start();
      o.stop(c.currentTime + dur + 0.02);
    },
    startStretch: function (strain) {
      const c = this.ensure();
      if (!c) return;
      this.stopStretch();
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = "triangle";
      const freq = 140 + strain * 260;
      o.frequency.setValueAtTime(freq, c.currentTime);
      g.gain.setValueAtTime(0.0001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.045, c.currentTime + 0.06);
      o.connect(g); g.connect(c.destination);
      o.start();
      this.stretchOsc = o;
      this.stretchGain = g;
    },
    updateStretch: function (strain) {
      const c = this.ctx;
      if (!c || !this.stretchOsc) {
        if (strain > 0.2) this.startStretch(strain);
        return;
      }
      const freq = 140 + clamp(strain, 0, 2) * 280;
      this.stretchOsc.frequency.setTargetAtTime(freq, c.currentTime, 0.04);
      const vol = 0.03 + clamp(strain - 0.7, 0, 1) * 0.04;
      this.stretchGain.gain.setTargetAtTime(state.muted ? 0.0001 : vol, c.currentTime, 0.05);
    },
    stopStretch: function (twang) {
      const c = this.ctx;
      if (!c || !this.stretchOsc) return;
      const o = this.stretchOsc, g = this.stretchGain;
      this.stretchOsc = null;
      this.stretchGain = null;
      if (twang && !state.muted) {
        const freq = o.frequency.value;
        o.frequency.exponentialRampToValueAtTime(Math.max(60, freq * 0.55), c.currentTime + 0.18);
        g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.2);
        o.stop(c.currentTime + 0.22);
      } else {
        g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.05);
        o.stop(c.currentTime + 0.08);
      }
    },
    snap: function () {
      const c = this.ensure();
      if (!c) return;
      this.stopStretch(false);
      this.beep(220, 0.18, "sawtooth", 0.06, 70);
      this.beep(90, 0.22, "square", 0.05, 40);
      const dur = 0.18;
      const buffer = c.createBuffer(1, c.sampleRate * dur, c.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
      }
      const src = c.createBufferSource();
      const f = c.createBiquadFilter();
      const g = c.createGain();
      src.buffer = buffer;
      f.type = "bandpass";
      f.frequency.value = 900;
      g.gain.setValueAtTime(0.22, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      src.connect(f); f.connect(g); g.connect(c.destination);
      src.start();
    },
    hook: function () { this.beep(520, 0.08, "triangle", 0.05); },
    win: function () {
      this.beep(523, 0.14, "triangle", 0.06);
      setTimeout(() => this.beep(659, 0.14, "triangle", 0.06), 110);

    fail: function () { this.beep(180, 0.25, "sine", 0.05, 80); },
    foot: function (t) {

  function currentLevel() { return LEVELS[state.levelIndex]; }

  function pegDist(i, j, level) {
    const a = level.pegs[i], b = level.pegs[j];
    return dist(a.x, a.y, b.x, b.y);
  }

  // ----- Bands -----
  function makeBand(i, j, level) {
    const a = level.pegs[i], b = level.pegs[j];
    const d = dist(a.x, a.y, b.x, b.y);
    const nodes = [];
    for (let s = 0; s <= SEGMENTS; s++) {
      const t = s / SEGMENTS;
      const x = lerp(a.x, b.x, t);
      const y = lerp(a.y, b.y, t);
      nodes.push({ x: x, y: y, px: x, py: y, pinned: s === 0 || s === SEGMENTS });
    }
    return {
      i: i, j: j,
      nodes: nodes,
      rest: NATURAL / SEGMENTS,
      alive: true,
      justSnapped: false,
    };
  }

  function bandLength(band) {
    let len = 0;
    for (let i = 1; i < band.nodes.length; i++) {
      const a = band.nodes[i - 1], b = band.nodes[i];
      len += dist(a.x, a.y, b.x, b.y);
    }
    return len;
  }

  function bandStrain(band) {
    return bandLength(band) / NATURAL;
  }

  function straightStrain(x1, y1, x2, y2) {
    return dist(x1, y1, x2, y2) / NATURAL;
  }

  function bandMid(band) {
    const nodes = band.nodes;
    const m = nodes[nodes.length >> 1];
    return { x: m.x, y: m.y };
  }

  // ----- Pip -----
  function resetPip() {

    state.pip = {

      y: L.start.y,
      vx: 0,
      vy: 0,
      r: PIP_R,
      onGround: true,
      facing: 1,
      walkPhase: 0,
      squash: 1,
      alive: true,
      onBand: null,
      bounceLock: 0,
    };
  }

  function clearSimBits() {

    state.snaps = [];
    state.floaters = [];
    state.shake = 0;
    state.snapCount = 0; state.lastKick = null;
    state.failTimer = 0;
    state.winTimer = 0;

  function loadLevel(index, keepGhosts) {
    state.levelIndex = clamp(index, 0, LEVELS.length - 1);
    state.mode = "build";
    state.screen = "play";
    state.bands = [];
    state.undo = [];
    state.usedBands = 0;
    state.stars = 0;
    state.dragging = null;
    state.message = currentLevel().hint;
    if (!keepGhosts) state.ghosts = [];
    clearSimBits();
    resetPip();
    sfx.stopStretch(false);
  }

  function bandsUsed() { return state.bands.length; }

  function canPlace(i, j, level) {
    if (i === j || i < 0 || j < 0) return false;
    if (state.bands.some(function (b) { return (b.i === i && b.j === j) || (b.i === j && b.j === i); })) return false;
    if (state.bands.length >= level.budget) return false;
    const s = pegDist(i, j, level) / NATURAL;
    if (s >= SNAP_RATIO) return "snap";
    return true;
  }

  function placeBand(i, j) {
    const level = currentLevel();
    const ok = canPlace(i, j, level);
    if (ok === "snap") {
      sfx.snap();
      addFloater((level.pegs[i].x + level.pegs[j].x) / 2, (level.pegs[i].y + level.pegs[j].y) / 2 - 20, "Too tight!");
      burst((level.pegs[i].x + level.pegs[j].x) / 2, (level.pegs[i].y + level.pegs[j].y) / 2, "#c44530", 14);
      state.shake = 8;
      return false;
    }
    if (!ok) return false;
    const band = makeBand(i, j, level);
    state.bands.push(band);
    state.undo.push({ type: "place" });
    sfx.hook();
    return true;
  }

  function undo() {
    if (state.mode !== "build") return;
    if (!state.bands.length) return;
    state.bands.pop();
    sfx.click();
  }

  function addFloater(x, y, text) {
    state.floaters.push({ x: x, y: y, text: text, life: 1, vy: -26 });
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 180;
      state.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 40,
        life: 0.5 + Math.random() * 0.4,
        max: 0.7,
        color: color,
        r: 1.5 + Math.random() * 2.5,
      });
    }
  }

  function snapBand(band, reason) {
    if (!band.alive) return;
    band.alive = false;
    band.justSnapped = true;
    const mid = bandMid(band);
    const strain = Math.max(1, bandStrain(band));
    sfx.snap();
    state.snapCount += 1;
    state.shake = 12 + (strain - 1) * 10;
    addFloater(mid.x, mid.y - 16, "SNAP!");
    burst(mid.x, mid.y, "#d14b3a", 22);
    // Recoil visuals
    const a = band.nodes[0], b = band.nodes[band.nodes.length - 1];
    state.snaps.push(
      { x1: a.x, y1: a.y, x2: mid.x, y2: mid.y, life: 0.35 },
      { x1: b.x, y1: b.y, x2: mid.x, y2: mid.y, life: 0.35 }
    );
    // Launch Pip if nearby
    const pip = state.pip;
    if (pip && pip.alive) {
      let closest = 1e9, cx = mid.x, cy = mid.y, nx = 0, ny = -1;
      for (let i = 1; i < band.nodes.length; i++) {
        const p = closestPoint(band.nodes[i - 1], band.nodes[i], pip.x, pip.y);
        const d = dist(pip.x, pip.y, p.x, p.y);
        if (d < closest) {
          closest = d;
          cx = p.x; cy = p.y;
        }
      }
      if (closest < 120) {
        const pa = band.nodes[0], pb = band.nodes[band.nodes.length - 1];
        const steep = Math.abs(pb.y - pa.y) > Math.abs(pb.x - pa.x) * 0.65;
        const fallIn = pip.vy;
        // Walkway snaps drop Pip. A real fall onto a tight band (or a steep
        // band plus a fall) turns the snap into a launch.
        if (fallIn > 160 && (steep || fallIn > 240)) {
          const energy = clamp(strain - 1, 0, 1.2);
          const kick = 860 + energy * 900;
          const lx = 0.18;
          const ly = -0.98;
          pip.vx = lx * kick;
          pip.vy = ly * kick;
          state.lastKick = { closest: Math.round(closest), kick: Math.round(kick), x: pip.x, y: pip.y, vy: pip.vy, kind: "launch" };
        } else {
          pip.vx *= 0.45;
          pip.vy = Math.max(pip.vy, 140);
          state.lastKick = { closest: Math.round(closest), x: pip.x, y: pip.y, kind: "drop" };
        }
        pip.onGround = false;
        pip.bounceLock = 0.18;
        pip.squash = 1.3;
      }
    }
    // Remove after a tick so the loop can skip it
    const idx = state.bands.indexOf(band);
    if (idx >= 0) state.bands.splice(idx, 1);
  }

  function closestPoint(a, b, px, py) {
    const abx = b.x - a.x, aby = b.y - a.y;
    const t = clamp(((px - a.x) * abx + (py - a.y) * aby) / (abx * abx + aby * aby || 1), 0, 1);
    return { x: a.x + abx * t, y: a.y + aby * t, t: t };
  }

  // ----- Physics -----
  function stepBand(band, dt) {
    const level = currentLevel();
    const pa = level.pegs[band.i], pb = level.pegs[band.j];
    const nodes = band.nodes;
    const n = nodes.length;
    nodes[0].x = pa.x; nodes[0].y = pa.y;
    nodes[n - 1].x = pb.x; nodes[n - 1].y = pb.y;

    for (let i = 1; i < n - 1; i++) {
      const nd = nodes[i];
      let vx = (nd.x - nd.px) * 0.985;
      let vy = (nd.y - nd.py) * 0.985;
      nd.px = nd.x;
      nd.py = nd.y;
      nd.x += vx;
      nd.y += vy + GRAVITY * 0.22 * dt * dt;
    }
    nodes[0].x = pa.x; nodes[0].y = pa.y;
    nodes[n - 1].x = pb.x; nodes[n - 1].y = pb.y;

    const rest = band.rest;
    for (let k = 0; k < 10; k++) {
      for (let i = 0; i < n - 1; i++) {
        const A = nodes[i], B = nodes[i + 1];
        let dx = B.x - A.x, dy = B.y - A.y;
        const d = Math.hypot(dx, dy) || 0.0001;
        const diff = (d - rest) / d;
        const inv = (A.pinned ? 0 : 1) + (B.pinned ? 0 : 1);
        if (!inv) continue;
        const s = 0.55 * diff / inv;
        if (!A.pinned) { A.x += dx * s; A.y += dy * s; }
        if (!B.pinned) { B.x -= dx * s; B.y -= dy * s; }
      }
      nodes[0].x = pa.x; nodes[0].y = pa.y;
      nodes[n - 1].x = pb.x; nodes[n - 1].y = pb.y;
    }

    if (bandStrain(band) >= SNAP_RATIO) snapBand(band, "stretch");
  }

  function overlapCircleAABB(px, py, rad, r) {
    const cx = clamp(px, r.x, r.x + r.w);
    const cy = clamp(py, r.y, r.y + r.h);
    const dx = px - cx, dy = py - cy;
    if (dx === 0 && dy === 0) {
      const left = px - r.x, right = r.x + r.w - px;
      const top = py - r.y, bot = r.y + r.h - py;
      return { embedded: true, d: 0, nx: 0, ny: -1, gap: Math.min(left, right, top, bot) };
    }
    const d = Math.hypot(dx, dy);
    if (d >= rad) return null;
    return { embedded: false, d: d, nx: dx / d, ny: dy / d, pen: rad - d };
  }

  function sweepRayAABB(ox, oy, dx, dy, r) {
    let tmin = 0, tmax = 1;
    let nx = 0, ny = 0;
    if (Math.abs(dx) < 1e-9) {
      if (ox < r.x || ox > r.x + r.w) return null;
    } else {
      const inv = 1 / dx;
      let t1 = (r.x - ox) * inv, t2 = (r.x + r.w - ox) * inv;
      let n1 = -1, n2 = 1;
      if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; n1 = 1; n2 = -1; }
      if (t1 > tmin) { tmin = t1; nx = n1; ny = 0; }
      if (t2 < tmax) tmax = t2;
      if (tmax < tmin) return null;
    }
    if (Math.abs(dy) < 1e-9) {
      if (oy < r.y || oy > r.y + r.h) return null;
    } else {
      const inv = 1 / dy;
      let t1 = (r.y - oy) * inv, t2 = (r.y + r.h - oy) * inv;
      let ny1 = -1, ny2 = 1;
      if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; ny1 = 1; ny2 = -1; }
      if (t1 > tmin) { tmin = t1; nx = 0; ny = ny1; }
      if (t2 < tmax) tmax = t2;
      if (tmax < tmin) return null;
    }
    if (tmin < 0 || tmin > 1) return null;
    return { t: tmin, nx: nx, ny: ny };
  }

  function pushOutOfRect(pip, r) {
    const rad = pip.r;
    const cx = clamp(pip.x, r.x, r.x + r.w);
    const cy = clamp(pip.y, r.y, r.y + r.h);
    let dx = pip.x - cx, dy = pip.y - cy;
    if (dx === 0 && dy === 0) {
      const left = pip.x - r.x, right = r.x + r.w - pip.x;
      const top = pip.y - r.y, bot = r.y + r.h - pip.y;
      const m = Math.min(left, right, top, bot);
      if (m === top) { pip.y = r.y - rad - 0.06; return { nx: 0, ny: -1 }; }
      if (m === bot) { pip.y = r.y + r.h + rad + 0.06; return { nx: 0, ny: 1 }; }
      if (m === left) { pip.x = r.x - rad - 0.06; return { nx: -1, ny: 0 }; }
      pip.x = r.x + r.w + rad + 0.06; return { nx: 1, ny: 0 };
    }
    const d = Math.hypot(dx, dy) || 0.0001;
    const nx = dx / d, ny = dy / d;
    const pen = rad - d;
    if (pen <= 0) return null;
    pip.x += nx * (pen + 0.06);
    pip.y += ny * (pen + 0.06);
    return { nx: nx, ny: ny };
  }

  function applySolidHit(pip, nx, ny) {
    const vn = pip.vx * nx + pip.vy * ny;
    if (vn < 0) {
      const resti = (ny < -0.65) ? FLOOR_RESTI : SOLID_RESTI;
      pip.vx -= vn * nx * (1 + resti);
      pip.vy -= vn * ny * (1 + resti);
    }
    if (ny < -0.55 && pip.vy >= -60) {
      pip.onGround = true;
      if (pip.vy > 0) pip.vy = 0;
      pip.squash = 0.9;
    }
  }

  function rangeOverlap(a1, a2, b1, b2) {
    return Math.min(a2, b2) - Math.max(a1, b1);
  }

  function resolvePlatformAxis(pip, ox, oy, axis) {
    const level = currentLevel();
    const rad = pip.r;
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 0; i < level.platforms.length; i++) {
        const r = level.platforms[i];
        const xOv = rangeOverlap(pip.x - rad, pip.x + rad, r.x, r.x + r.w);
        const yOv = rangeOverlap(pip.y - rad, pip.y + rad, r.y, r.y + r.h);
        if (xOv <= 0 || yOv <= 0) continue;

        if (axis === "x") {
          // Grazing the floor or ceiling while walking: do not shove sideways.
          const onTop = (oy + rad) <= r.y + 2.5 && yOv <= 3.5;
          const onBot = (oy - rad) >= r.y + r.h - 2.5 && yOv <= 3.5;
          if (onTop || onBot) continue;
          // Step up onto a ledge if Pip arrives a little below the lip
          // (sagging walkways often meet a platform a few pixels low).
          const feet = pip.y + rad;
          if (feet > r.y && feet <= r.y + STEP_UP && pip.y < r.y + 6 && pip.vy > -80) {
            pip.y = r.y - rad;
            if (pip.vy > 0) pip.vy = 0;
            pip.onGround = true;
            continue;
          }
          // Rising past a lip: do not grab the vertical face or a snap-launch
          // clips the top-left corner of a wall and dies in the pit.
          if (pip.vy < -200 && pip.y <= r.y + rad * 1.8) continue;
          if (pip.x < r.x + r.w * 0.5) {
            pip.x = r.x - rad - 0.05;
            applySolidHit(pip, -1, 0);
          } else {
            pip.x = r.x + r.w + rad + 0.05;
            applySolidHit(pip, 1, 0);
          }
        } else {
          // Rising past a top-left/right lip: skip so a launch is not
          // sucked into the block or bounced off the corner.
          if (pip.vy < -200 && pip.y <= r.y + rad * 1.8) continue;
          const wasAbove = (oy + rad) <= r.y + 2.2;
          const wasBelow = (oy - rad) >= r.y + r.h - 2.2;
          const preferTop = wasAbove || (!wasBelow && (pip.vy >= 0 && pip.y + rad * 0.25 <= r.y + r.h * 0.5));
          if (preferTop) {
            pip.y = r.y - rad;
            applySolidHit(pip, 0, -1);
          } else {
            pip.y = r.y + r.h + rad + 0.05;
            applySolidHit(pip, 0, 1);
          }
        }
      }
    }
  }

  function collidePipPlatforms(pip, ox, oy, axis) {
    if (axis) {
      resolvePlatformAxis(pip, ox, oy, axis);
      return;
    }
    resolvePlatformAxis(pip, ox, oy, "x");
    resolvePlatformAxis(pip, pip.x, oy, "y");
    const level = currentLevel();
    const rad = pip.r;
    for (let i = 0; i < level.platforms.length; i++) {
      const r = level.platforms[i];
      if (pip.x + rad * 0.45 > r.x && pip.x - rad * 0.45 < r.x + r.w) {
        const feet = pip.y + rad;
        if (feet >= r.y - 1.4 && feet <= r.y + 4 && pip.y <= r.y + 0.5 && pip.vy >= -70) {
          pip.y = r.y - rad;
          if (pip.vy > 0) pip.vy = 0;
          pip.onGround = true;
        }
      }
    }
  }

  function collidePipBands(pip, dt) {
    if (pip.bounceLock > 0) pip.bounceLock -= dt;
    for (let b = 0; b < state.bands.length; b++) {
      const band = state.bands[b];
      if (!band.alive) continue;
      const nodes = band.nodes;
      for (let i = 1; i < nodes.length; i++) {
        const A = nodes[i - 1], B = nodes[i];
        const p = closestPoint(A, B, pip.x, pip.y);
        const endSkip = (pip.vy > 100) ? 3 : 8;
        if (A.pinned && dist(p.x, p.y, A.x, A.y) < endSkip) continue;
        if (B.pinned && dist(p.x, p.y, B.x, B.y) < endSkip) continue;
        const dx = pip.x - p.x, dy = pip.y - p.y;
        const d = Math.hypot(dx, dy);
        const rad = pip.r + BAND_HALF;
        if (d >= rad || d === 0) continue;
        const nx = dx / d, ny = dy / d;
        const pen = rad - d;
        pip.x += nx * pen * 0.95;
        pip.y += ny * pen * 0.95;

        const incoming = Math.max(0, -(pip.vx * nx + pip.vy * ny));
        const wA = A.pinned ? 0 : (1 - p.t);
        const wB = B.pinned ? 0 : p.t;
        const load = 20 + incoming * 0.07;
        if (wA) { A.x -= nx * load * wA * 0.05; A.y -= ny * load * wA * 0.05; }
        if (wB) { B.x -= nx * load * wB * 0.05; B.y -= ny * load * wB * 0.05; }

        if (ny < -0.18) {
          pip.onBand = band;
          if (!A.pinned) A.y += 0.55;
          if (!B.pinned) B.y += 0.55;
          const strain = bandStrain(band);
          if (strain >= RED_AT) {
            snapBand(band, "load");
            return;
          }
          const tness = clamp((strain - 0.88) / 0.52, 0, 1);
          const trampoline = strain >= YELLOW_AT && incoming > 200;
          if (incoming > 55 && trampoline && pip.bounceLock <= 0) {
            const resti = 0.42 + tness * 0.78;
            const vn = pip.vx * nx + pip.vy * ny;
            pip.vx -= vn * nx * (1 + resti);
            pip.vy -= vn * ny * (1 + resti);
            const pop = 40 + tness * 220;
            pip.vx += nx * pop * 0.25 + pip.facing * (10 + tness * 28);
            pip.vy += ny * pop;
            pip.onGround = false;
            pip.squash = 1.12 + tness * 0.22;
            pip.bounceLock = 0.1 + tness * 0.1;
            sfx.boing(strain);
          } else {
            pip.onGround = true;
            if (pip.vy > 0) pip.vy = 0;
          }
        } else {
          const vn = pip.vx * nx + pip.vy * ny;
          if (vn < 0) {
            pip.vx -= vn * nx;
            pip.vy -= vn * ny;
          }
        }
      }
    }
  }

  function collideSpikes(pip) {
    const level = currentLevel();
    for (let i = 0; i < level.spikes.length; i++) {
      const s = level.spikes[i];
      if (pip.x + pip.r * 0.5 > s.x && pip.x - pip.r * 0.5 < s.x + s.w &&
          pip.y + pip.r > s.y + 4 && pip.y - pip.r * 0.2 < s.y + s.h) {
        return true;
      }
    }
    return false;
  }

  function reachedGoal(pip) {
    if (!pip.onGround) return false;
    const g = currentLevel().goal;
    const level = currentLevel();
    for (let i = 0; i < level.platforms.length; i++) {
      const r = level.platforms[i];
      if (Math.abs(r.y - g.y) > 10) continue;
      if (g.x < r.x - 6 || g.x > r.x + r.w + 6) continue;
      if (pip.x + pip.r * 0.25 >= r.x && pip.x - pip.r * 0.25 <= r.x + r.w &&
          Math.abs(pip.y + pip.r - r.y) < 8) return true;
    }
    return dist(pip.x, pip.y, g.x, g.y - 18) < 26;
  }

  function starCount(used, par, budget) {
    if (used <= par) return 3;
    if (used <= par + 1) return 2;
    return 1;
  }

  function maxPenetration() {
    const pip = state.pip;
    if (!pip) return 0;
    const level = currentLevel();
    let maxp = 0;
    for (let i = 0; i < level.platforms.length; i++) {
      const r = level.platforms[i];
      const cx = clamp(pip.x, r.x, r.x + r.w);
      const cy = clamp(pip.y, r.y, r.y + r.h);
      if (cx === pip.x && cy === pip.y) {
        const d = Math.min(pip.x - r.x, r.x + r.w - pip.x, pip.y - r.y, r.y + r.h - pip.y);
        maxp = Math.max(maxp, pip.r + d);
      } else {
        const d = Math.hypot(pip.x - cx, pip.y - cy);
        maxp = Math.max(maxp, pip.r - d);
      }
    }
    return maxp;
  }

  function stepPip(dt) {
    const pip = state.pip;
    if (!pip || !pip.alive) return;
    if (state.mode !== "run") return;

    pip.vy += GRAVITY * dt;
    if (pip.onGround) {
      pip.vx += WALK_ACCEL * dt * pip.facing;
      pip.vx = clamp(pip.vx, -WALK_SPEED, WALK_SPEED);
      if (Math.abs(pip.vx) > 20) {
        pip.walkPhase += dt * 8;
        sfx.foot(time);
      }
      pip.vx *= (1 - GROUND_FRICTION * dt * 0.15);
    } else {
      pip.vx += WALK_ACCEL * 0.06 * dt * pip.facing;
      pip.vx *= (1 - AIR_DRAG * dt);
    }
    pip.squash = lerp(pip.squash, 1, 1 - Math.pow(0.001, dt));

    const travel = Math.hypot(pip.vx, pip.vy) * dt;
    const steps = clamp(Math.ceil(travel / MAX_SUB_PX), 1, 24);
    const sdt = dt / steps;
    pip.onGround = false;
    pip.onBand = null;
    for (let s = 0; s < steps; s++) {
      const ox = pip.x, oy = pip.y;
      pip.x += pip.vx * sdt;
      collidePipPlatforms(pip, ox, oy, "x");
      const ix = pip.x;
      pip.y += pip.vy * sdt;
      collidePipPlatforms(pip, ix, oy, "y");
      collidePipBands(pip, sdt);
      collidePipPlatforms(pip, pip.x, pip.y);
      if (!pip.alive || state.mode !== "run") return;
    }

    if (pip.x < pip.r - 8) { pip.x = pip.r - 8; if (pip.vx < 0) pip.vx = 0; }
    if (pip.x > W - pip.r + 8) { pip.x = W - pip.r + 8; if (pip.vx > 0) pip.vx = 0; }

    if (pip.y > H + 40 || collideSpikes(pip)) {
      failRun();
      return;
    }
    if (reachedGoal(pip)) {
      winRun();
    }
  }

  function failRun() {
    if (state.mode !== "run") return;
    state.mode = "fail";
    state.pip.alive = false;
    state.failTimer = 1.15;
    sfx.fail();
    burst(state.pip.x, state.pip.y, "#e07a5f", 16);
    addFloater(state.pip.x, state.pip.y - 24, "Oh no!");
  }

  function winRun() {
    if (state.mode !== "run") return;
    state.mode = "win";
    const L = currentLevel();
    state.usedBands = bandsUsed() + 0; // current remaining live + we count placed at go
    // Count how many were placed when Go was pressed, stored on pip
    const used = state.goUsed || bandsUsed();
    state.usedBands = used;
    state.stars = starCount(used, L.par, L.budget);
    const key = L.id;
    state.best[key] = Math.max(state.best[key] || 0, state.stars);
    state.winTimer = 0;
    state.pip.vx *= 0.3;
    sfx.win();
    addFloater(L.goal.x, L.goal.y - 50, "Home!");
  }

  function go() {
    if (state.mode !== "build") return;
    state.ghosts = state.bands.map(function (b) { return { i: b.i, j: b.j }; });
    state.goUsed = state.bands.length;
    state.mode = "run";
    resetPip();
    state.pip.onGround = true;
    sfx.click();
  }

  function restartKeepLayout() {
    const ghosts = state.ghosts.length ? state.ghosts.slice() :
      state.bands.map(function (b) { return { i: b.i, j: b.j }; });
    loadLevel(state.levelIndex, true);
    state.ghosts = ghosts;
    const level = currentLevel();
    ghosts.forEach(function (g) {
      if (canPlace(g.i, g.j, level) === true) {
        state.bands.push(makeBand(g.i, g.j, level));
      }
    });
    state.undo = state.bands.map(function () { return { type: "place" }; });
  }

  function stepWorld(dt) {
    time += dt;
    if (state.shake) state.shake = Math.max(0, state.shake - dt * 40);

    if (state.mode === "build" || state.mode === "run" || state.mode === "fail" || state.mode === "win") {
      // copy because snap mutates
      const list = state.bands.slice();
      for (let i = 0; i < list.length; i++) {
        if (list[i].alive) stepBand(list[i], dt);
      }
    }
    if (state.mode === "run") stepPip(dt);
    if (state.mode === "win") {
      const pip = state.pip;
      if (pip) {
        pip.vy = 0;
        pip.vx *= 0.9;
        pip.walkPhase += dt * 3;
        pip.squash = 1 + Math.sin(time * 8) * 0.05;
      }
    }
    if (state.mode === "fail") {
      state.failTimer -= dt;
      if (state.pip) {
        state.pip.vy += GRAVITY * dt * 0.5;
        state.pip.y += state.pip.vy * dt;
      }
      if (state.failTimer <= 0) restartKeepLayout();
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.vy += 900 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) state.particles.splice(i, 1);
    }
    for (let i = state.floaters.length - 1; i >= 0; i--) {
      const f = state.floaters[i];
      f.y += f.vy * dt;
      f.life -= dt * 0.8;
      if (f.life <= 0) state.floaters.splice(i, 1);
    }
    for (let i = state.snaps.length - 1; i >= 0; i--) {
      state.snaps[i].life -= dt;
      if (state.snaps[i].life <= 0) state.snaps.splice(i, 1);
    }
  }

  // ----- Layout / input -----
  function resize() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H);
    ox = (vw - W * scale) / 2;
    oy = (vh - H * scale) / 2;
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    canvas.style.width = vw + "px";
    canvas.style.height = vh + "px";
  }

  function worldFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    let cx, cy;
    if (e.touches && e.touches.length) {
      cx = e.touches[0].clientX;
      cy = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length) {
      cx = e.changedTouches[0].clientX;
      cy = e.changedTouches[0].clientY;
    } else {
      cx = e.clientX;
      cy = e.clientY;
    }
    return {
      x: (cx - rect.left - ox) / scale,
      y: (cy - rect.top - oy) / scale,
    };
  }

  function pegAt(x, y, level) {
    let best = -1, bestD = PEG_HIT;
    for (let i = 0; i < level.pegs.length; i++) {
      const d = dist(x, y, level.pegs[i].x, level.pegs[i].y);
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  function hitButton(x, y) {
    const buttons = state.buttons;
    for (let i = 0; i < buttons.length; i++) {
      const b = buttons[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
    }
    return null;
  }

  function onDown(e) {
    e.preventDefault();
    sfx.ensure();
    const p = worldFromEvent(e);
    const btn = hitButton(p.x, p.y);
    if (btn) {
      btn.onClick();
      return;
    }
    if (state.screen !== "play") return;
    if (state.mode !== "build") return;
    const level = currentLevel();
    const peg = pegAt(p.x, p.y, level);
    if (peg >= 0) {
      state.dragging = { from: peg, x: p.x, y: p.y };
      sfx.startStretch(0.6);
    }
  }

  function onMove(e) {
    e.preventDefault();
    const p = worldFromEvent(e);
    if (state.screen === "play") {
      const level = currentLevel();
      state.hoverPeg = pegAt(p.x, p.y, level);
    }
    if (!state.dragging) return;
    state.dragging.x = p.x;
    state.dragging.y = p.y;
    const level = currentLevel();
    const a = level.pegs[state.dragging.from];
    const hover = pegAt(p.x, p.y, level);
    const bx = hover >= 0 ? level.pegs[hover].x : p.x;
    const by = hover >= 0 ? level.pegs[hover].y : p.y;
    sfx.updateStretch(straightStrain(a.x, a.y, bx, by));
  }

  function onUp(e) {
    e.preventDefault();
    if (!state.dragging) return;
    const p = worldFromEvent(e);
    const level = currentLevel();
    const from = state.dragging.from;
    const to = pegAt(p.x, p.y, level);
    state.dragging = null;
    if (to >= 0 && to !== from) {
      const s = pegDist(from, to, level) / NATURAL;
      sfx.stopStretch(s < SNAP_RATIO);
      placeBand(from, to);
    } else {
      sfx.stopStretch(false);
    }
  }

  canvas.addEventListener("mousedown", onDown);
  canvas.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  canvas.addEventListener("touchstart", onDown, { passive: false });
  canvas.addEventListener("touchmove", onMove, { passive: false });
  canvas.addEventListener("touchend", onUp, { passive: false });
  canvas.addEventListener("touchcancel", onUp, { passive: false });
  window.addEventListener("resize", resize);
  window.addEventListener("keydown", function (e) {
    if (e.key === "r" || e.key === "R") {
      if (state.screen === "play") restartKeepLayout();
    }
    if (e.key === "z" || e.key === "Z") undo();
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      if (state.screen === "title") { sfx.ensure(); loadLevel(0); }
      else if (state.mode === "build") go();
      else if (state.mode === "win") nextLevel();
    }
  });

  function nextLevel() {
    if (state.levelIndex < LEVELS.length - 1) loadLevel(state.levelIndex + 1);
    else state.screen = "title";
  }

  // ----- Draw -----
  function roundRect(c, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  function drawPaper(c) {
    c.fillStyle = "#f3ead8";
    c.fillRect(0, 0, W, H);
    c.fillStyle = "rgba(60, 44, 28, 0.07)";
    for (let y = 16; y < H; y += 22) {
      for (let x = 16; x < W; x += 22) {
        c.beginPath();
        c.arc(x, y, 0.9, 0, Math.PI * 2);
        c.fill();
      }
    }
    // warm vignette
    const g = c.createRadialGradient(W * 0.5, H * 0.45, 80, W * 0.5, H * 0.5, 460);
    g.addColorStop(0, "rgba(243,234,216,0)");
    g.addColorStop(1, "rgba(90,60,30,0.10)");
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
  }

  function drawWood(c, r) {
    c.save();
    roundRect(c, r.x, r.y, r.w, r.h, 6);
    const g = c.createLinearGradient(r.x, r.y, r.x, r.y + 18);
    g.addColorStop(0, "#e2c089");
    g.addColorStop(0.4, "#c99555");
    g.addColorStop(1, "#b07d42");
    c.fillStyle = g;
    c.fill();
    c.strokeStyle = "rgba(80,50,20,0.35)";
    c.lineWidth = 1.2;
    c.stroke();
    c.beginPath();
    c.strokeStyle = "rgba(255,230,180,0.28)";
    c.lineWidth = 2;
    c.moveTo(r.x + 6, r.y + 3);
    c.lineTo(r.x + r.w - 6, r.y + 3);
    c.stroke();
    // grain
    c.strokeStyle = "rgba(90,50,20,0.08)";
    c.lineWidth = 1;
    for (let y = r.y + 10; y < r.y + r.h - 4; y += 11) {
      c.beginPath();
      c.moveTo(r.x + 4, y);
      c.bezierCurveTo(r.x + r.w * 0.3, y + 2, r.x + r.w * 0.7, y - 2, r.x + r.w - 4, y);
      c.stroke();
    }
    c.restore();
  }

  function drawSpikes(c, s) {
    const n = Math.max(3, Math.floor(s.w / 16));
    const w = s.w / n;
    c.fillStyle = "#8a8f99";
    c.strokeStyle = "rgba(40,40,50,0.4)";
    c.lineWidth = 1;
    c.beginPath();
    for (let i = 0; i < n; i++) {
      const x = s.x + i * w;
      c.moveTo(x, s.y + s.h);
      c.lineTo(x + w * 0.5, s.y);
      c.lineTo(x + w, s.y + s.h);
    }
    c.closePath();
    c.fill();
    c.stroke();
    c.fillStyle = "#c9cdd4";
    c.beginPath();
    for (let i = 0; i < n; i++) {
      const x = s.x + i * w;
      c.moveTo(x + w * 0.5, s.y);
      c.lineTo(x + w * 0.62, s.y + s.h * 0.55);
      c.lineTo(x + w * 0.5, s.y + s.h * 0.55);
    }
    c.fill();
  }

  function drawPeg(c, peg, glow) {
    c.save();
    c.translate(peg.x, peg.y);
    c.fillStyle = "rgba(40,25,10,0.22)";
    c.beginPath();
    c.ellipse(1.5, 4, 8, 3.5, 0, 0, Math.PI * 2);
    c.fill();
    if (glow) {
      c.fillStyle = "rgba(220,160,50,0.28)";
      c.beginPath();
      c.arc(0, 0, 18, 0, Math.PI * 2);
      c.fill();
    }
    const g = c.createRadialGradient(-2, -3, 1, 0, 0, 11);
    g.addColorStop(0, "#f0d37a");
    g.addColorStop(0.45, "#c9a227");
    g.addColorStop(1, "#7a5a12");
    c.fillStyle = g;
    c.beginPath();
    c.arc(0, 0, 10, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = "rgba(80,50,10,0.55)";
    c.lineWidth = 1.2;
    c.stroke();
    c.beginPath();
    c.arc(0, 0, 3.2, 0, Math.PI * 2);
    c.fillStyle = "#3a2a10";
    c.fill();
    c.beginPath();
    c.arc(-2.5, -3, 2, 0, Math.PI * 2);
    c.fillStyle = "rgba(255,255,230,0.55)";
    c.fill();
    c.restore();
  }

  function drawBandPoly(c, nodes, color, width, shiver) {
    c.save();
    c.strokeStyle = "rgba(40,20,10,0.18)";
    c.lineWidth = width + 3;
    c.lineCap = "round";
    c.lineJoin = "round";
    c.beginPath();
    c.moveTo(nodes[0].x, nodes[0].y + 2);
    for (let i = 1; i < nodes.length; i++) c.lineTo(nodes[i].x, nodes[i].y + 2);
    c.stroke();
    c.strokeStyle = color;
    c.lineWidth = width;
    c.beginPath();
    const ox2 = shiver ? Math.sin(time * 50) * 1.2 : 0;
    c.moveTo(nodes[0].x + ox2, nodes[0].y);
    for (let i = 1; i < nodes.length; i++) c.lineTo(nodes[i].x + ox2, nodes[i].y);
    c.stroke();
    c.strokeStyle = "rgba(255,255,255,0.28)";
    c.lineWidth = Math.max(1.2, width * 0.28);
    c.beginPath();
    c.moveTo(nodes[0].x + ox2, nodes[0].y - 2);
    for (let i = 1; i < nodes.length; i++) c.lineTo(nodes[i].x + ox2, nodes[i].y - 2);
    c.stroke();
    c.restore();
  }

  function previewNodes(x1, y1, x2, y2) {
    const d = dist(x1, y1, x2, y2);
    const slack = Math.max(0, NATURAL - d);
    const sag = slack * 0.45 + (d > NATURAL ? 4 : 10);
    const nodes = [];
    for (let s = 0; s <= 10; s++) {
      const t = s / 10;
      const x = lerp(x1, x2, t);
      const y = lerp(y1, y2, t) + Math.sin(t * Math.PI) * sag * (d > NATURAL ? 0.15 : 1);
      nodes.push({ x: x, y: y });
    }
    return nodes;
  }

  function drawFlag(c, g) {
    const x = g.x, y = g.y;
    c.save();
    c.strokeStyle = "#5c3d1e";
    c.lineWidth = 3;
    c.lineCap = "round";
    c.beginPath();
    c.moveTo(x, y);
    c.lineTo(x, y - 54);
    c.stroke();
    const wave = Math.sin(time * 3) * 3;
    c.beginPath();
    c.moveTo(x, y - 52);
    c.quadraticCurveTo(x + 18, y - 46 + wave, x + 34, y - 44 + wave);
    c.lineTo(x + 30, y - 28 + wave);
    c.quadraticCurveTo(x + 16, y - 32, x, y - 34);
    c.closePath();
    c.fillStyle = "#e24b4b";
    c.fill();
    c.strokeStyle = "rgba(120,20,20,0.35)";
    c.lineWidth = 1;
    c.stroke();
    c.beginPath();
    c.arc(x, y - 54, 2.2, 0, Math.PI * 2);
    c.fillStyle = "#c9a227";
    c.fill();
    c.restore();
  }

  function drawPip(c, pip) {
    if (!pip) return;
    c.save();
    c.translate(pip.x, pip.y);
    const sq = pip.squash || 1;
    c.scale(2 - sq, sq);
    // shadow
    c.fillStyle = "rgba(40,25,10,0.22)";
    c.beginPath();
    c.ellipse(0, pip.r + 1, 11, 3.5, 0, 0, Math.PI * 2);
    c.fill();
    // backpack
    c.fillStyle = "#3d6e8c";
    roundRect(c, -15, -4, 8, 12, 2);
    c.fill();
    // body
    const body = c.createRadialGradient(-4, -6, 3, 0, 0, 16);
    body.addColorStop(0, "#ffe0b0");
    body.addColorStop(1, "#e7a25a");
    c.fillStyle = body;
    c.beginPath();
    c.arc(0, 0, pip.r - 1, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = "rgba(120,70,30,0.35)";
    c.lineWidth = 1.2;
    c.stroke();
    // blush
    c.fillStyle = "rgba(230,110,90,0.3)";
    c.beginPath(); c.ellipse(-7, 3, 3, 1.8, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(7, 3, 3, 1.8, 0, 0, Math.PI * 2); c.fill();
    // eyes
    const look = pip.facing * 1.4;
    c.fillStyle = "#2a1c12";
    c.beginPath(); c.ellipse(-4 + look, -3, 2.1, 2.6, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(5 + look, -3, 2.1, 2.6, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#fff";
    c.beginPath(); c.arc(-3.4 + look, -4, 0.8, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(5.6 + look, -4, 0.8, 0, Math.PI * 2); c.fill();
    // smile
    c.strokeStyle = "#7a4a28";
    c.lineWidth = 1.2;
    c.beginPath();
    c.arc(0.5 + look, 3, 4, 0.15, Math.PI - 0.15);
    c.stroke();
    // legs
    if (state.mode === "run" && pip.onGround) {
      const ph = pip.walkPhase;
      c.strokeStyle = "#c9843c";
      c.lineWidth = 2.2;
      c.lineCap = "round";
      c.beginPath();
      c.moveTo(-3, 12);
      c.lineTo(-3 + Math.sin(ph) * 5, 16);
      c.moveTo(4, 12);
      c.lineTo(4 + Math.sin(ph + Math.PI) * 5, 16);
      c.stroke();
    }
    // worry brows if on a red band
    if (pip.onBand && bandStrain(pip.onBand) > RED_AT) {
      c.strokeStyle = "#2a1c12";
      c.lineWidth = 1.3;
      c.beginPath();
      c.moveTo(-7, -8); c.lineTo(-2, -6);
      c.moveTo(8, -8); c.lineTo(3, -6);
      c.stroke();
    }
    c.restore();
  }

  function layoutButtons() {
    const buttons = [];
    const y = H - 74;
    const h = 48;
    if (state.screen === "title") {
      buttons.push({ id: "play", x: 70, y: 430, w: 260, h: 54, label: "Play", kind: "primary", onClick: function () { sfx.ensure(); sfx.click(); loadLevel(0); } });
      // level chips, two rows of four
      for (let i = 0; i < LEVELS.length; i++) {
        const cx = 24 + (i % 4) * 90;
        const cy = 548 + Math.floor(i / 4) * 52;
        buttons.push({
          id: "lv" + i, x: cx, y: cy, w: 80, h: 42,
          label: String(i + 1), kind: "chip",
          onClick: (function (idx) { return function () { sfx.ensure(); sfx.click(); loadLevel(idx); }; })(i),
        });
      }
    } else if (state.screen === "play") {
      buttons.push({ id: "undo", x: 14, y: y, w: 78, h: h, label: "Undo", kind: "ghost", onClick: function () { undo(); } });
      buttons.push({ id: "retry", x: 98, y: y, w: 78, h: h, label: "Retry", kind: "ghost", onClick: function () { sfx.click(); restartKeepLayout(); } });
      if (state.mode === "build") {
        buttons.push({ id: "go", x: 186, y: y, w: 130, h: h, label: "Go", kind: "primary", onClick: function () { go(); } });
      } else if (state.mode === "win") {
        const last = state.levelIndex >= LEVELS.length - 1;
        buttons.push({
          id: "next", x: 186, y: y, w: 130, h: h,
          label: last ? "Menu" : "Next",
          kind: "primary",
          onClick: function () { sfx.click(); nextLevel(); },
        });
      } else {
        buttons.push({ id: "busy", x: 186, y: y, w: 130, h: h, label: state.mode === "fail" ? "..." : "Running", kind: "ghost", onClick: function () {} });
      }
      buttons.push({
        id: "mute", x: 352, y: 14, w: 34, h: 34, label: state.muted ? "Off" : "On", kind: "icon",
        onClick: function () { state.muted = !state.muted; if (state.muted) sfx.stopStretch(false); },
      });
      buttons.push({
        id: "menu", x: 14, y: 14, w: 58, h: 34, label: "Menu", kind: "icon",
        onClick: function () { sfx.click(); state.screen = "title"; sfx.stopStretch(false); },
      });
    }
    state.buttons = buttons;
  }

  function drawButton(c, b) {
    c.save();
    if (b.kind === "primary") {
      roundRect(c, b.x, b.y, b.w, b.h, 14);
      const g = c.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
      g.addColorStop(0, "#f0b04a");
      g.addColorStop(1, "#d4892a");
      c.fillStyle = g;
      c.fill();
      c.strokeStyle = "rgba(90,50,10,0.35)";
      c.lineWidth = 1.2;
      c.stroke();
      c.fillStyle = "#3a240c";
      c.font = "700 20px Trebuchet MS, Segoe UI, sans-serif";
      c.textAlign = "center";
      c.textBaseline = "middle";
      c.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
    } else if (b.kind === "ghost" || b.kind === "chip" || b.kind === "icon") {
      roundRect(c, b.x, b.y, b.w, b.h, b.kind === "icon" ? 10 : 12);
      c.fillStyle = "rgba(255,250,240,0.72)";
      c.fill();
      c.strokeStyle = "rgba(90,60,30,0.22)";
      c.lineWidth = 1;
      c.stroke();
      c.fillStyle = "#4a3420";
      c.font = (b.kind === "icon" ? "600 13px" : "700 15px") + " Trebuchet MS, Segoe UI, sans-serif";
      c.textAlign = "center";
      c.textBaseline = "middle";
      c.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
    }
    c.restore();
  }

  function drawStarsRow(c, x, y, n, size) {
    for (let i = 0; i < 3; i++) {
      const sx = x + i * (size + 8);
      drawStar(c, sx, y, size, i < n);
    }
  }

  function drawStar(c, x, y, size, on) {
    c.save();
    c.translate(x, y);
    c.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
      const b = a + Math.PI / 5;
      const r1 = size, r2 = size * 0.42;
      if (i === 0) c.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
      else c.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
      c.lineTo(Math.cos(b) * r2, Math.sin(b) * r2);
    }
    c.closePath();
    c.fillStyle = on ? "#f0c03a" : "rgba(80,60,30,0.18)";
    c.fill();
    if (on) {
      c.strokeStyle = "rgba(140,90,10,0.45)";
      c.lineWidth = 1;
      c.stroke();
    }
    c.restore();
  }

  function drawComfortCircle(c, peg, taut) {
    c.save();
    c.setLineDash([5, 6]);
    c.strokeStyle = taut ? "rgba(200,70,40,0.35)" : "rgba(70,120,60,0.28)";
    c.lineWidth = 1.4;
    c.beginPath();
    c.arc(peg.x, peg.y, NATURAL, 0, Math.PI * 2);
    c.stroke();
    c.setLineDash([]);
    c.restore();
  }

  function drawTitle(c) {
    drawPaper(c);
    // decorative band
    const nodes = previewNodes(46, 168, 354, 188);
    drawBandPoly(c, nodes, strainColor(1.05), 10, false);
    drawPeg(c, { x: 46, y: 168 }, false);
    drawPeg(c, { x: 354, y: 188 }, false);
    drawPip(c, { x: 200, y: 154, r: 16, facing: 1, walkPhase: time * 2, squash: 1 + Math.sin(time * 3) * 0.04, onGround: true, onBand: null });

    c.fillStyle = "#3a2714";
    c.font = "800 34px Trebuchet MS, Segoe UI, sans-serif";
    c.textAlign = "center";
    c.fillText("Rubber Band", W / 2, 250);
    c.fillText("Bridge", W / 2, 288);
    c.fillStyle = "#7a5a38";
    c.font = "16px Trebuchet MS, Segoe UI, sans-serif";
    c.fillText("Stretch it. Don't snap it. Get Pip home.", W / 2, 324);

    c.fillStyle = "#5c4630";
    c.font = "14px Trebuchet MS, Segoe UI, sans-serif";
    c.fillText("Drag peg to peg  ·  Go  ·  Watch the colours", W / 2, 400);
    c.fillText("Pick a level", W / 2, 530);
  }

  function drawPlay(c) {
    const level = currentLevel();
    drawPaper(c);

    // platforms and spikes
    for (let i = 0; i < level.platforms.length; i++) drawWood(c, level.platforms[i]);
    for (let i = 0; i < level.spikes.length; i++) drawSpikes(c, level.spikes[i]);
    drawFlag(c, level.goal);

    // ghosts
    if (state.mode === "build" && state.ghosts.length && !state.bands.length) {
      state.ghosts.forEach(function (g) {
        const a = level.pegs[g.i], b = level.pegs[g.j];
        if (!a || !b) return;
        c.save();
        c.setLineDash([6, 6]);
        c.strokeStyle = "rgba(80,60,40,0.22)";
        c.lineWidth = 6;
        c.beginPath();
        c.moveTo(a.x, a.y);
        c.lineTo(b.x, b.y);
        c.stroke();
        c.restore();
      });
    }

    // bands
    for (let i = 0; i < state.bands.length; i++) {
      const band = state.bands[i];
      const s = bandStrain(band);
      drawBandPoly(c, band.nodes, strainColor(s), 8 + clamp(s, 1, 1.7) * 1.5, s >= RED_AT);
    }

    // preview
    if (state.dragging) {
      const a = level.pegs[state.dragging.from];
      const hover = state.hoverPeg;
      const bx = hover >= 0 && hover !== state.dragging.from ? level.pegs[hover].x : state.dragging.x;
      const by = hover >= 0 && hover !== state.dragging.from ? level.pegs[hover].y : state.dragging.y;
      const s = straightStrain(a.x, a.y, bx, by);
      drawComfortCircle(c, a, s >= RED_AT);
      const nodes = previewNodes(a.x, a.y, bx, by);
      drawBandPoly(c, nodes, strainColor(s, 0.9), 8, s >= RED_AT);
    }

    for (let i = 0; i < level.pegs.length; i++) {
      const glow = state.hoverPeg === i || (state.dragging && state.dragging.from === i);
      drawPeg(c, level.pegs[i], glow);
    }

    drawPip(c, state.pip);

    // snap remnants
    for (let i = 0; i < state.snaps.length; i++) {
      const s = state.snaps[i];
      c.strokeStyle = "rgba(200,60,40," + (s.life / 0.35) + ")";
      c.lineWidth = 6;
      c.lineCap = "round";
      c.beginPath();
      c.moveTo(s.x1, s.y1);
      c.lineTo(s.x2, s.y2);
      c.stroke();
    }

    for (let i = 0; i < state.particles.length; i++) {
      const p = state.particles[i];
      c.globalAlpha = clamp(p.life / p.max, 0, 1);
      c.fillStyle = p.color;
      c.beginPath();
      c.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      c.fill();
      c.globalAlpha = 1;
    }

    for (let i = 0; i < state.floaters.length; i++) {
      const f = state.floaters[i];
      c.globalAlpha = clamp(f.life, 0, 1);
      c.fillStyle = "#3a2714";
      c.font = "700 18px Trebuchet MS, Segoe UI, sans-serif";
      c.textAlign = "center";
      c.fillText(f.text, f.x, f.y);
      c.globalAlpha = 1;
    }

    // top HUD
    c.fillStyle = "rgba(255,250,240,0.82)";
    roundRect(c, 80, 12, 240, 42, 12);
    c.fill();
    c.fillStyle = "#3a2714";
    c.font = "700 15px Trebuchet MS, Segoe UI, sans-serif";
    c.textAlign = "center";
    c.textBaseline = "middle";
    c.fillText((state.levelIndex + 1) + ". " + level.title, W / 2, 25);
    c.font = "12px Trebuchet MS, Segoe UI, sans-serif";
    c.fillStyle = "#6a5238";
    const used = (state.mode === "build") ? state.bands.length : (state.goUsed || state.bands.length);
    c.fillText("Bands  " + used + " / " + level.budget + "   ·   Par " + level.par, W / 2, 42);

    // remaining band icons
    // hint
    if (state.mode === "build" || state.mode === "run") {
      c.fillStyle = "rgba(255,250,240,0.75)";
      roundRect(c, 18, H - 118, 364, 34, 10);
      c.fill();
      c.fillStyle = "#5c4630";
      c.font = "13px Trebuchet MS, Segoe UI, sans-serif";
      c.textAlign = "center";
      c.fillText(level.hint, W / 2, H - 100);
    }

    // win card
    if (state.mode === "win") {
      c.fillStyle = "rgba(40,28,16,0.28)";
      c.fillRect(0, 80, W, 430);
      roundRect(c, 46, 200, 308, 210, 18);
      c.fillStyle = "#fffaf0";
      c.fill();
      c.strokeStyle = "rgba(90,60,20,0.2)";
      c.stroke();
      c.fillStyle = "#3a2714";
      c.font = "800 26px Trebuchet MS, Segoe UI, sans-serif";
      c.textAlign = "center";
      c.fillText("Pip is home!", W / 2, 240);
      drawStarsRow(c, W / 2 - 40, 290, state.stars, 18);
      c.fillStyle = "#6a5238";
      c.font = "15px Trebuchet MS, Segoe UI, sans-serif";
      c.fillText(state.stars + " star" + (state.stars === 1 ? "" : "s") + "  ·  " + state.usedBands + " band" + (state.usedBands === 1 ? "" : "s") + "  (par " + level.par + ")", W / 2, 330);
      if (level.snapSolve) {
        c.font = "13px Trebuchet MS, Segoe UI, sans-serif";
        c.fillText("Snap Solve  —  the snap was the point.", W / 2, 356);
      }
    }
  }

  function draw() {
    layoutButtons();
    const vw = canvas.width;
    const vh = canvas.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, vw, vh);
    ctx.fillStyle = "#2a2018";
    ctx.fillRect(0, 0, vw, vh);

    const shx = (state.shake ? (Math.random() - 0.5) * state.shake : 0);
    const shy = (state.shake ? (Math.random() - 0.5) * state.shake : 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.translate(ox + shx, oy + shy);
    ctx.scale(scale, scale);

    // clip to design
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.clip();

    if (state.screen === "title") drawTitle(ctx);
    else drawPlay(ctx);

    for (let i = 0; i < state.buttons.length; i++) drawButton(ctx, state.buttons[i]);
    ctx.restore();
  }

  let last = now();
  function frame() {
    const t = now();
    let dt = Math.min(0.05, t - last);
    last = t;
    acc += dt;
    let steps = 0;
    while (acc >= DT && steps < 5) {
      stepWorld(DT);
      acc -= DT;
      steps++;
    }
    draw();
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);

  // Public test API (headless checks)
  window.__RBB = {
    W: W, H: H, NATURAL: NATURAL, SNAP_RATIO: SNAP_RATIO, LEVELS: LEVELS,
    getState: function () {
      return {
        screen: state.screen,
        mode: state.mode,
        levelIndex: state.levelIndex,
        title: currentLevel ? (state.screen === "play" ? currentLevel().title : "title") : "title",
        bands: state.bands.length,
        budget: state.screen === "play" ? currentLevel().budget : 0,
        par: state.screen === "play" ? currentLevel().par : 0,
        stars: state.stars,
        usedBands: state.usedBands,
        pip: state.pip ? { x: state.pip.x, y: state.pip.y, vx: state.pip.vx, vy: state.pip.vy, alive: state.pip.alive, onGround: state.pip.onGround } : null,
        pegs: state.screen === "play" ? currentLevel().pegs : [],
        shaking: state.shake, snapCount: state.snapCount, lastKick: state.lastKick,
        muted: state.muted,
      };
    },
    startGame: function () { loadLevel(0); return this.getState(); },
    loadLevel: function (i) { loadLevel(i); return this.getState(); },
    placeBand: function (i, j) { return placeBand(i, j); },
    go: function () { go(); return this.getState(); },
    undo: function () { undo(); },
    restart: function () { restartKeepLayout(); return this.getState(); },
    tick: function (n) {
      n = n || 1;
      for (let i = 0; i < n; i++) stepWorld(DT);
      return this.getState();
    },
    strainBetween: function (i, j) {
      const L = currentLevel();
      return pegDist(i, j, L) / NATURAL;
    },
    canPlace: function (i, j) { return canPlace(i, j, currentLevel()); },
    bandStrains: function () { return state.bands.map(bandStrain); },
    starCount: starCount,
    SOLUTIONS: SOLUTIONS,
    NAIVE: NAIVE,
    maxPenetration: maxPenetration,
    runTunnelTest: function (speed) {
      const li = 4;
      loadLevel(li);
      const level = currentLevel();
      let slab = null;
      for (let i = 0; i < level.platforms.length; i++) {
        const r = level.platforms[i];
        if (r.h >= 40 && r.h <= 80 && r.w >= 50 && r.x > 200 && r.y < 400 && r.y + r.h < 520) {
          slab = r; break;
        }
      }
      if (!slab) slab = level.platforms[3];
      const pip = state.pip;
      pip.x = slab.x + slab.w * 0.5;
      pip.y = slab.y + slab.h + pip.r + 8;
      pip.vx = 0;
      pip.vy = -(speed || 2200);
      pip.onGround = false;
      pip.alive = true;
      state.mode = "run";
      state.screen = "play";
      let maxp = 0;
      let tunneledToTop = false;
      let minY = pip.y;
      let hitUnderside = false;
      const startY = pip.y;
      const left = slab.x + 4, right = slab.x + slab.w - 4;
      const under = slab.y + slab.h;
      for (let i = 0; i < 200; i++) {
        if (!pip.alive && i > 4) break;
        const vy0 = pip.vy;
        stepWorld(DT);
        if (pip.y < minY) minY = pip.y;
        const pen = maxPenetration();
        if (pen > maxp) maxp = pen;
        if (pip.x > left && pip.x < right && pip.y + pip.r >= under - 2 && vy0 < -50 && pip.vy > -50) {
          hitUnderside = true;
        }
        const feet = pip.y + pip.r;
        if (pip.x > left && pip.x < right && feet <= slab.y + 1 && pip.y < slab.y) {
          tunneledToTop = true;
        }
        if (state.mode === "fail" && i > 4) break;
      }
      return {
        platform: { x: slab.x, y: slab.y, w: slab.w, h: slab.h },
        startY: startY,
        minY: minY,
        hitUnderside: hitUnderside,
        maxPenetration: maxp,
        tunneledToTop: tunneledToTop,
        final: { x: pip.x, y: pip.y, vx: pip.vx, vy: pip.vy, alive: pip.alive, mode: state.mode }
      };
    },
  };
})();
</script>
